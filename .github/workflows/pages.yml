# Build the site as plain files and publish it to GitHub Pages on every push
# to main. The site is served from https://<user>.github.io/<repository>/,
# so every link starts with "/<repository name>".
name: Publish to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one publish at a time; a newer push replaces one that is waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the tests
        run: cargo test
      - name: Export the site
        env:
          REPOSITORY: ${{ github.event.repository.name }}
        run: cargo run --release --bin export -- --base "/$REPOSITORY" --out dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
