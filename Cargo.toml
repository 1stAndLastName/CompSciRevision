[package]
name = "revision_site"
version = "0.1.0"
edition = "2024"
# `cargo run` starts the web server; the export is `cargo run --bin export`.
default-run = "revision_site"

[dependencies]
actix-files = "0.7.0"
actix-web = "4"
askama = "0.16.1"
pulldown-cmark = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
toml = "1.1.6"
