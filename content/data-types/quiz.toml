[[question]]
prompt = "Which data type is most suitable for storing a phone number such as `07700 900123`?"
options = ["String", "Integer", "Real", "Boolean"]
answer = 0
explanation = "A phone number can start with 0 and contain a space, and nobody does arithmetic with it, so it is text: a string. Storing it as an integer would drop the leading 0."
spec = "1.4.1(a)"
difficulty = 1

[[question]]
prompt = "What is the hexadecimal value of the binary number `1011 0110`?"
options = ["`B6`", "`6B`", "`116`", "`182`"]
answer = 0
explanation = "Split into nibbles from the right: `1011` is 11, which is B, and `0110` is 6, giving `B6`. 182 is the denary value, not the hexadecimal."
spec = "1.4.1(f)"
difficulty = 1

[[question]]
prompt = "What is `2F` (hexadecimal) in denary?"
options = ["47", "32", "215", "17"]
answer = 0
explanation = "The first digit is worth 16s and F is 15, so 2 × 16 + 15 = 47."
spec = "1.4.1(f)"
difficulty = 1

[[question]]
prompt = "What is −20 as an 8-bit two's complement binary number?"
options = ["`1110 1100`", "`1001 0100`", "`1110 1011`", "`0001 0100`"]
answer = 0
explanation = "+20 is `0001 0100`. Flipping every bit gives `1110 1011`, and adding 1 gives `1110 1100`. Check: −128 + 64 + 32 + 8 + 4 = −20. `1001 0100` is −20 in sign and magnitude, and `1110 1011` forgets to add 1."
spec = "1.4.1(c)"
difficulty = 2

[[question]]
prompt = "What is the range of an 8-bit two's complement integer?"
options = ["−128 to 127", "−127 to 127", "0 to 255", "−128 to 128"]
answer = 0
explanation = "The most significant bit is worth −128 and the other seven bits add up to at most 127, so the range is −128 to 127. −127 to 127 is the range of sign and magnitude, which wastes a pattern on a second zero."
spec = "1.4.1(c)"
difficulty = 1

[[question]]
prompt = "Two unsigned 8-bit numbers, `1100 0000` and `0101 0000`, are added. What happens?"
options = ["Overflow: the answer needs 9 bits", "The answer is `0001 0000` with no problem", "Underflow: the answer is too small", "The answer is negative"]
answer = 0
explanation = "192 + 80 = 272, which is more than 255, the largest number 8 bits can hold. A carry goes out of the most significant bit, so the result overflows; the 8 bits left (`0001 0000`) do not hold the right answer."
spec = "1.4.1(d)"
difficulty = 2

[[question]]
prompt = "A floating point number has an 8-bit mantissa `0101 0000` and a 4-bit exponent `0010`, both in two's complement. What is its denary value?"
options = ["2.5", "5", "0.625", "1.25"]
answer = 0
explanation = "The mantissa is `0.1010000`, which is 0.625. The exponent is 2, so move the binary point 2 places right: `10.1`, which is 2.5."
spec = "1.4.1(g)"
difficulty = 2

[[question]]
prompt = "Which of these 8-bit mantissas is normalised?"
options = ["`1011 0000`", "`0011 0000`", "`1101 0000`", "`0001 0000`"]
answer = 0
explanation = "A normalised mantissa starts with two different bits: `01` if positive or `10` if negative. `1011 0000` starts `10`, so it is a normalised negative number. Mantissas starting `00` or `11` can be shifted left to gain precision."
spec = "1.4.1(g)"
difficulty = 2

[[question]]
prompt = "Normalise the mantissa `0001 1000` with exponent `0110`."
options = ["Mantissa `0110 0000`, exponent `0100`", "Mantissa `0110 0000`, exponent `1000`", "Mantissa `0000 0110`, exponent `1000`", "Mantissa `0110 0000`, exponent `0110`"]
answer = 0
explanation = "Shift the mantissa left 2 places so it starts `01`: `0110 0000`. Moving the binary point 2 places right makes the number 4 times bigger, so take 2 off the exponent to keep the same value: 6 − 2 = 4, which is `0100`."
spec = "1.4.1(g)"
difficulty = 3

[[question]]
prompt = "When adding two floating point numbers, what must be done before the mantissas are added?"
options = ["Make the exponents the same", "Normalise both mantissas", "Add the exponents together", "Convert both numbers to sign and magnitude"]
answer = 0
explanation = "Mantissas can only be added when their binary points line up, which means the exponents must match. Shift right the mantissa of the number with the smaller exponent, increasing that exponent until they are equal. Normalisation comes last, on the result."
spec = "1.4.1(h)"
difficulty = 2

[[question]]
prompt = "Which mask and operator set the most significant bit of a byte to 1 and leave every other bit unchanged?"
options = ["OR with `1000 0000`", "AND with `1000 0000`", "XOR with `1000 0000`", "AND with `0111 1111`"]
answer = 0
explanation = "OR with 1 always gives 1, and OR with 0 leaves a bit as it was, so `1000 0000` sets just the MSB. AND with `1000 0000` would clear the other bits, and XOR would flip the MSB rather than always setting it."
spec = "1.4.1(i)"
difficulty = 2

[[question]]
prompt = "The byte `0000 1100` (12) has a logical shift left by 2 places. What is the result?"
options = ["`0011 0000` (48)", "`0000 0011` (3)", "`0000 1100` (12)", "`0001 1000` (24)"]
answer = 0
explanation = "Each bit moves 2 places left and 0s fill the gap on the right, giving `0011 0000`. Each place left doubles an unsigned number, so 2 places multiply by 4: 12 × 4 = 48."
spec = "1.4.1(i)"
difficulty = 2

[[question]]
prompt = "Why was Unicode introduced when ASCII already existed?"
options = ["ASCII's 128 codes cannot represent the characters of most of the world's languages", "ASCII cannot represent digits", "Unicode always uses less storage than ASCII", "ASCII cannot be stored in binary"]
answer = 0
explanation = "With 7 bits, ASCII has room for only 128 characters, enough for English but not for other alphabets and symbols. Unicode uses more bits per character, so it can represent over a million characters. It often uses more storage, not less."
spec = "1.4.1(j)"
difficulty = 1

[[question]]
prompt = "What is the denary number 77 as an 8-bit binary number?"
options = ["`0100 1101`", "`0100 1110`", "`1011 0010`", "`0100 1011`"]
answer = 0
explanation = "77 = 64 + 8 + 4 + 1, so there are 1s in the 64, 8, 4 and 1 columns: `0100 1101`. `0100 1110` is 78 and `0100 1011` is 75."
spec = "1.4.1(b)"
difficulty = 1

[[question]]
prompt = "What is the denary number 200 in hexadecimal?"
options = ["`C8`", "`8C`", "`128`", "`C80`"]
answer = 0
explanation = "200 = 12 × 16 + 8. Twelve is C, so the answer is `C8`. In binary, 200 is `1100 1000`, and the two nibbles are C and 8. `8C` has the digits the wrong way round."
spec = "1.4.1(e)"
difficulty = 1

[[question]]
prompt = "In 8-bit two's complement, 50 − 75 is worked out by adding `0011 0010` (50) and the two's complement of 75. What is the result?"
options = ["`1110 0111`", "`1001 1001`", "`0001 1001`", "`1110 0110`"]
answer = 0
explanation = "75 is `0100 1011`. Flipping the bits and adding 1 gives `1011 0101` (−75). `0011 0010` + `1011 0101` = `1110 0111`, which is −128 + 64 + 32 + 4 + 2 + 1 = −25. `1001 1001` is −25 in sign and magnitude, and `1110 0110` comes from forgetting to add 1."
spec = "1.4.1(d)"
difficulty = 3

[[question]]
prompt = "Add 2.5 (mantissa `0101 0000`, exponent `0010`) and 0.75 (mantissa `0110 0000`, exponent `0000`). Both use two's complement. What is the result?"
options = ["Mantissa `0110 1000`, exponent `0010`", "Mantissa `0110 1000`, exponent `0000`", "Mantissa `1011 0000`, exponent `0010`", "Mantissa `0110 1000`, exponent `0100`"]
answer = 0
explanation = "Line up the exponents first: 0.75 has the smaller exponent, so shift its mantissa right 2 places to `0001 1000` with exponent 2. Adding gives `0110 1000`, exponent 2, which is 0.8125 × 4 = 3.25. Adding the mantissas without lining them up gives `1011 0000`, which would be a negative number."
spec = "1.4.1(h)"
difficulty = 3
