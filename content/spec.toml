# OCR A Level Computer Science (H446): the detailed content from section 2c
# of the specification (version 3.0), components 01 and 02.
#
# Every `spec` value in content/ must be a point listed here ("1.4.3") or one
# of its lettered sub-points ("1.4.3(b)"). The home page lists every point and
# shows which ones have a topic yet.
#
# Layout:
#   [[component]]  code and title
#   [[section]]    component, number ("1.4") and title
#   [[point]]      component, section, number ("1.4.3") and title
#   [[point.sub]]  one lettered sub-point: letter and text, plus `items` if the
#                  spec lists bullets under it
# 1.5.2 has no lettered sub-points, so its text and bullets sit on the point.

