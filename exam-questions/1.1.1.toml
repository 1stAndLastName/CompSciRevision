[[question]]
number = 3
marks = 9

[[question.part]]
label = "3"
marks = 9
text = '''
Most modern computers are designed using Von Neumann Architecture. However, in some cases Harvard Architecture may be preferred.

Discuss the difference between Von Neumann Architecture and Harvard Architecture.

You should refer to the following in your answer:

- the different approaches each architecture takes to storing instructions and data
- the benefits of using a Von Neumann Architecture approach
- the benefits of using a Harvard Architecture approach.
'''

[[question.mark_scheme]]
label = "3"
marks = 2
answer = '''
**Mark Band 3- High Level**\
**(7-9 marks)**\
The candidate demonstrates a thorough knowledge and\
understanding of both Von Neumann

and Harvard architectures.\
All detail is generally accurate and relevant.\
The candidate is able to apply their knowledge and understanding directly and consistently to the context provided.\
Evidence/examples will be explicitly relevant to the explanation. The candidate will come to a clear conclusion that must be justified by their comments.

There is a well-developed line of reasoning which is clear and logically structured. The information presented is relevant and substantiated.

**Mark Band 2- Mid Level**\
**(4-6 marks)**\
The candidate demonstrates reasonable knowledge and\
understanding of Von Neumann and Harvard architectures; the material is generally accurate but at times underdeveloped. The candidate may not have applied both to this scenario. The candidate is able to apply their knowledge and understanding directly to the context provided although one or two opportunities are missed. Evidence/examples are for the most part implicitly relevant to the explanation.\
The candidate will attempt to come to a conclusion, although it may not be fully justified by their answer.

There is a line of reasoning presented with some structure. The information presented is in the most part relevant and supported by some evidence.

**Mark Band 1- Low Level**\
**(1-3 marks)**\
The candidate demonstrates a basic knowledge of Von Neumann and Harvard architectures. The material is basic and contains some\
inaccuracies.\
The candidate makes a limited attempt to apply acquired knowledge and understanding to the context provided.

The candidate provides nothing more than an unsupported assertion.

The information is basic and communicated in an unstructured way. The information is supported by limited evidence and the relationship to the evidence may not be clear.

**0 mark**\
No attempt to answer the question or response is not worthy of credit.
'''
guidance = '''
AO1\
Harvard Architecture:

- Uses separate memory for data and instructions.

- Uses separate data and address buses for each piece of memory
- Can read/write data and instructions simultaneously

Von Neumann Architecture:

- Uses one physical piece of memory for both data and instructions
- Uses one data and one address bus.
- Can only read/write data or instructions, not both at the same time

AO2

- Von Neumann design is less complex. Development of one is cheaper. Harvard design is more complex as it requires two buses. Development is more expensive. More CPU pins are required; a complex motherboard is required with doubling of memory.
- Harvard Architecture free data memory cannot be used for instructions and vice-versa

AO3

- Harvard architecture allows for faster processing as instructions and data are simultaneously fetched/executed.
- Harvard splits memory between instruction and data in a static way, meaning you could run out of one memory with unused memory in the other area.
- Von Neumann architecture allows for dynamic allocation between instruction and data

- Large programs with small data (Computer games) or small programs with large data (video editing) can be equally catered for

**Examiner’s Comments**

Candidates were assessed on the quality of their extended response in this question. Most of the candidates were clear on the basic difference between Harvard and Von Neumann architecture, but many did not discuss this in detail or did not use the correct terminology. Some candidates confused the different architectures and contradicted points in their discussion.

Exemplar 1

*[Image redrawn from the original mark scheme by an AI model (Gemma 4 12B). It may contain mistakes.]*

A candidate's handwritten answer:
> Von Neumann and Harvard store data in
> different ways. They both have separate
> memory and address buses, however Harvard
> has separate memory locations for data and
> instruction while Von Neumann stores all
> both in the same memory.
> 
> Von Neumann is good as it allows for
> [unclear] writing programs to be run off. A
> memory is joint, data and instructions
> can split memory in an efficient way,
> reducing bottlenecks to the same full like
> it can happen in Harvard architecture. Also,
> Von Neumann host programs are written to support
> a Von Neumann architecture therefore it's
> easier to set up and use has it has more support
> from developers. Better for multi-purpose systems.
> 
> Harvard is less complex and memory management
> is simpler. It's good for custom
> programs as it can run faster if
> code is written specifically. Very good for
> embedded systems in which structure can't change.
> In conclusion they're both useful
> while Von Neumann is more widely used
> and better for general purpose computers,
> Harvard architecture can be good for
> more simple and specific cases, such
> as embedded systems, or machines
> which do not need a general purpose
> CPU, &

This candidate response was given 5 marks. There are some valid points about both Von Neumann and Harvard Architecture, but the points made are not fully developed with limited application. This response was therefore given a mark within the mid- level band.

*[An examiner's marking symbol, not shown here.]*

**Assessment for learning**

Questions with the command word ‘discuss’ require candidates to give a balanced discussion and provided a suitable conclusion which justifies their comments. Opportunities to practise these questions will support candidates to do better on these style questions.
'''

