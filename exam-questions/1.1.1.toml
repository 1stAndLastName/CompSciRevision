spec = "1.1.1"

[[question]]
number = 1
marks = 8

[[question.part]]
label = "1(a)"
marks = 4
text = '''
The stored program concept uses the Fetch-Decode-Execute cycle to get the next instruction from memory and then execute it.

Describe what happens during the **fetch** stage of the Fetch-Decode-Execute cycle.

You should state the different registers and buses that are used in your answer.
'''

[[question.part]]
label = "1(b)"
marks = 1
text = '''
One of the instructions that may be fetched and executed as part of this cycle is a branch instruction.

State the name of the register that would be altered in the **execute** phase during a branch instruction.
'''

[[question.part]]
label = "1(c)"
marks = 3
text = '''
Three ways of improving the performance of a CPU are increasing the clock speed, adding more cores and using pipelining.

Explain how pipelining improves the performance of a CPU.
'''

[[question.mark_scheme]]
label = "1(a)"
marks = 4
answer = '''
1 mark per bullet to max 4:

- The **contents** of the Program Counter/PC are **copied/sent** to the Memory Address Register/ MAR
- The address is **sent/transferred** along the address bus
- The control unit **sends/transfers** a (read) signal along the control bus
- Contents stored in the memory address are **sent/transferred** along the data bus
- Contents (from memory) are stored in the Memory Data Register/MDR
- ...and **sent/copied** to the Current Instruction Register/ CIR
- The Program Counter/PC is incremented
'''
guidance = '''
Accept IR/Instruction Register for CIR/Current instruction Register

Accept MBR/Memory Buffer Register for MDR/Memory Data Register

**Examiner’s Comments**

Candidates who had good knowledge of the FDE cycle were able to gain 3 or 4 marks on this question. Some candidates did not have a good understanding of what a register or a bus is and tended to say they did something other than transport or temporarily store. Many however gave clear and correct responses.

*[An examiner's marking symbol, not shown here.]*

**Misconception**

Some candidates gave responses which mentioned a register fetching the data or passing data. A register is a temporary store for\
data/instructions/addresses and as such doesn’t fetch or pass anything.

Exemplar 1

*[Image redrawn from the original mark scheme by an AI model (Gemma 4 12B). It may contain mistakes.]*

A candidate's handwritten answer:
> The PC holds the next instruction's address which is
> copied to the MAR memory address register. The Program
> Counter is incremented. The address from the MAR is sent
> on the address bus to main memory. Simultaneously
> a read/write signal is sent on the control bus to the
> control unit. The data or instruction goes on the
> data bus and is copied into the memory data
> register. It is then copied into the CIR. [4]

This candidate has shown a clear understanding of the role of the buses and registers in the fetch part of the FDE cycle.
'''

[[question.mark_scheme]]
label = "1(b)"
marks = 1
answer = '''
- Program Counter / PC
'''
guidance = '''
**Examiner’s Comments**

Candidates who understood the FDE

cycle gained the mark. Those that did not tended to mention a register used in the fetch or decode stages.
'''

[[question.mark_scheme]]
label = "1(c)"
marks = 3
answer = '''
1 mark per bullet:

- Allows the next instruction to be fetched **whilst** the previous one is being decoded/executed /allows the overlapping of different parts of the FDE
- It **increases** throughput / **increases** the number of **instructions** processed **in a** **set period of time**
- It prevents the CPU having to wait / prevents idle components
'''
guidance = '''
DNA responses that talk about the FDE running **faster**.\
Allow a diagram demonstrating pipelining for MP1.

Allow ‘it will take less time to do the same amount of instructions’ for MP2

BOD ‘processes’ for ‘instructions’ for MP2.\
DNA ‘more efficient’ on its own for MP2

DNA points if clearly discussing multiple cores.

**Examiner’s Comments**

Many candidates were able to gain a mark for an instruction being fetched at the same time as another is decoded. Some candidates discussed multiple cores which were mentioned in the question stem but did not apply to this question. Candidates should have access to previous mark schemes.
'''

