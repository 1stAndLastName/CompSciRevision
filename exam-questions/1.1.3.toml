guidance = '''
Data stored by altering the magnetic field of a small section of the tape or disk; one orientation represents a binary value of 1, the opposite orientation represents a binary value of 0. Written to using a read head. Read head can then read the magnetic field and retrieve the data.\
These read and write heads move across the disk or the tape moves under the heads. Solid state devices store data using semiconductors; drives can be based on NAND Flash or DRAM. No moving parts are required.\
Backup involves copying potentially large amounts of data to and from storage devices at regular intervals.\
Servers distribute data to client devices.

AO2\
Magnetic hard drives entirely suitable for storing operating system, software and data. Large capacity, cheap (by comparison) purchasing price and reliability make them idea for heavy use in an insurance office. Solid state drives have no moving parts and offer an increase in speed and quicker access to customer records. However,

smaller capacity (in comparison) may be an issue for larger data sets.\
Backup systems may be required to maximise storage whereas access speed is not so much of an issue\
Limited lifespan of SSDs due to limited read/writes may restrict use in data heavy applications.\
Servers will require quick access to data to serve multiple client machines but will also be extremely read/write heavy.

AO3\
Both suitable for the insurance office but for different purposes.\
SSDs to store operating system and program files will ensure quicker boot up and loading of programs. May be useful for both client and servers to store operating systems Magnetic hard drives to store large quantities of data provides reliability and large capacity at small (by comparison) cost. May be most suitable for storing large amounts of data on client devices and for backup systems.\
Magnetic tape device may be suitable for backing up customer data as too slow for use on day-to-day basis.\
Use of solid state devices for storing customer data that is frequently accessed means needing to plan for replacement of drives when read/write limit reached. Solid state devices better if used in mobile devices (e.g. for mobile insurance workers) as relatively small chance of damage if dropped as no moving parts.
'''

