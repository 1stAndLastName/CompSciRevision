[[question]]
number = 1
marks = 3

[[question.part]]
label = "1"
marks = 3
text = '''
The performance of a computer system can be improved by adding more RAM.

Explain why adding more RAM will improve the performance of a computer system.
'''

[[question.mark_scheme]]
label = "1"
marks = 3
answer = '''
1 mark per bullet to max 3:

- Allows **more** **active/running/temporary** data in RAM
- It reduces the need to use virtual memory
- RAM is faster to access than VM/secondary storage...
- ...because **data** in VM/SS has to be swapped with **data** in RAM first
- Use of RAM rather than VM reduces the risk of disk thrashing
- Faster bootup/ shutdown time / reduces load/access time
'''
guidance = '''
MP1 must imply more/larger amount of data

Allow\
‘instructions/programs/apps/processes/tasks’ for data.

MP2 - BOD ‘no need for Virtual Memory’.

**Examiner’s Comments**

Most candidates were able to gain 1 or 2 marks on this question. Some confused primary with secondary saying that adding more RAM meant there was less need to use primary memory. Some confused RAM with Cache.
'''

[[question]]
number = 2
marks = 11

[[question.part]]
label = "2(a)"
marks = 2
text = '''
An embedded system is often a small device that is designed to carry out a limited number of specialised tasks. Professional athletes sometimes wear small embedded systems called fitness trackers in their shirts. These can be used to track their speed, position, heart rate and other performance data during an event. The tracker transmits this data to a pitch-side server which collates the data from all the athletes.

State the name of **one** input device that might be used in this embedded system and state what it would be used for.

Device

Use
'''

[[question.part]]
label = "2(b)"
marks = 4
text = '''
The fitness tracker manufacturers had to decide which type of secondary storage to use.

Explain **two** reasons why flash (solid state) storage would be the best type of secondary storage for the fitness tracker system.

1

2
'''

[[question.part]]
label = "2(c)"
text = '''
One use of ROM is to store the Basic Input Output System (BIOS). The BIOS is used when the computer is first turned on.
'''

[[question.part]]
label = "2(c)(i)"
marks = 3
text = '''
Describe what the BIOS will do to start up the computer.
'''

[[question.part]]
label = "2(c)(ii)"
marks = 2
text = '''
Apart from storing the BIOS, ROM can also be used in other ways.

Describe how an embedded system can make a different use of ROM and why it is an advantage.
'''

[[question.mark_scheme]]
label = "2(a)"
marks = 2
answer = '''
1 mark max for input device and 1 mark max for reason:

- Heart rate sensor
- Detects athlete’s electrical activity / heart rate

- GPS (receiver)
- Mapping the athlete’s **movement / position/ speed**

- Accelerometer/gyroscope/motion sensor
- To track the players acceleration/speed/movement/ counting steps/measuring orientation

- Button
- To allow the athlete to turn it on/off
'''
guidance = '''
Allow other suitable input devices as long as they are suitable for the scenario and an input device\
e.g.\
thermometers, light and UV sensors, skin response sensors, magnetometers, gyrometer, ECG

No FT for use if incorrect device

Use must be related to the fitness tracker scenario

**Examiner’s Comments**

The majority of candidates were able to state the name of a device, but many did not apply the use of their named input device to the scenario and gave responses related to a generic use of the device for example giving a heart rate sensor or monitor and then saying the use was to monitor the heart rate with no reference to the fitness tracker. A few gave devices which were unsuitable for an embedded system carried in a shirt such as keyboard and touchscreen.
'''

[[question.mark_scheme]]
label = "2(b)"
marks = 4
answer = '''
1 mark for reason and 1 mark for expansion up to a maximum of 4 marks.

- Durable/flash has no moving parts...
- ...so will be resistant to damage if the player runs/falls/collides with something
- Low power usage...
- ...won’t need recharging/will last during an event
- Small **physical size**/portable...
- ...so it can fit on a shirt/be unobtrusive/be worn / won’t affect the athlete’s performance
- Fast/real-time read/write speed...
- ...needed to rapidly record athlete’s data
'''
guidance = '''
Mark across whole answer space

Expansion must relate to scenario

DNA ‘small’ on its own

DNA anything to do with capacity

**Examiner’s Comments**

The majority of candidates were able to give a reason such as durable/no moving parts/ small physical size. Candidates who related the reason to why it would be suitable for the fitness tracker were able to gain full marks. Some candidates did not apply their response to the question stem well and instead talked about things like smart watches.

Exemplar 2

*[Image in the original mark scheme, not shown here.]*

The candidate has clearly given two reasons with good application to the scenario.
'''

[[question.mark_scheme]]
label = "2(c)(i)"
marks = 3
answer = '''
1 mark per bullet to max 3:

- Contains the computer start up instructions
- Loads **settings/configuration** (CMOS/NVRAM)
- Initialises/checks hardware/peripheral devices are available/work / carry out a POST check...
- ...and **reports** errors
- Determines the drive on which the OS is stored
- Finds/loads the bootstrap/operating system/kernel (into main memory)
'''
guidance = '''
DNA ‘boots up’ on its own

**Examiner’s Comments**

Many candidates were able to gain at least one or two marks for saying the BIOS finds/loads the operating system and/or checks hardware.
'''

[[question.mark_scheme]]
label = "2(c)(ii)"
marks = 2
answer = '''
Mark from one group to max 2:

- Storing firmware/ config/ operation instructions/ operating system/ device drivers...
- ...that can’t be overwritten / doesn’t need to be updated
- ...so that access is faster

OR

- Storing security settings/encryption keys/digital signatures...
- ...that must be maintained/can’t be changed

OR

- Could be used as primary storage...
- ...so no need to load programs into memory
- ...so would save time loading up the program

OR

- Could be used as secondary storage...
- ....so the device will not need additional storage...
- ....to reduce the size of the device
'''
guidance = '''
**Examiner’s Comments**

Strong candidates were able to give a use such as store the operating system and an advantage. Many though, gave a very good description of what ROM is but did not give a different use and so were unable to gain any marks. A few candidates said it could store the BIOS which had already been given in the question. A few candidates talked about microwaves and washing machines which was not relevant to this scenario
'''

[[question]]
number = 3
marks = 3

[[question.part]]
label = "3(a)"
marks = 1
text = '''
State the role of RAM in a computer system.
'''

[[question.part]]
label = "3(b)"
marks = 2
text = '''
Amaya is an amateur photographer and has bought an old second-hand computer to edit her photographs. The specifications of this computer are shown below.

| Processor: Dual Core 1.8 GHz |
|---|
| RAM: 1 GB |
| HDD: 500 GB |

Explain what is meant by the term ‘virtual memory’ and why this may be needed when Amaya is editing her photographs.
'''

[[question.mark_scheme]]
label = "3(a)"
marks = 1
answer = '''
- Stores instructions / programs **currently running**
- Stores data currently **in use**
'''
guidance = '''
**Examiner’s Comments**

This question was answered well, although some candidates stated the role of cache rather than RAM.

*[Image in the original mark scheme, not shown here.]*

**Misconception**

That RAM and cache are the same thing within a computer system.
'''

[[question.mark_scheme]]
label = "3(b)"
marks = 2
answer = '''
- If the amount of RAM available is insufficient…
- …Used to store instructions/data

- …Using secondary storage.
- Likely to be loading large image files (which may exceed her RAM)
- Likely to be loading large programs (which may exceed her RAM)
'''
guidance = '''
**Examiner’s Comments**

Most candidates achieved both of the

available marks for this question and linked the scenario in well when writing their response.
