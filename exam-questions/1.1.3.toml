text = '''
\* A charity has several desktop computers in their office that use a CISC processor. They are considering buying mobile devices for their staff to use when they are not in the office.

Discuss whether these mobile devices should use the same CISC processors that are used in their desktop computers or if they should use a RISC processor instead.

You should include the following in your answer:

- the difference between each processor type
- the suitability of each processor type for mobile devices.
'''

[[question.mark_scheme]]
label = "6"
answer = '''
**Mark Band 3–High Level (9-12 marks)** The candidate demonstrates a thorough knowledge and understanding of both CISC and RISC. The material is generally accurate and detailed.

The candidate is able to apply their knowledge and understanding directly and consistently to the context provided. Evidence/examples will be explicitly relevant to the explanation.

The candidate provides a thorough discussion which is well balanced. Evaluative comments are consistently relevant and well-considered.

There is a well-developed line of reasoning which is clear and logically structured. The information presented is relevant and substantiated.

**Mark Band 2-Mid Level (5-8 marks)** The candidate demonstrates\
reasonable knowledge and\
understanding of CISC and/or RISC; the material is generally accurate but at times underdeveloped.

The candidate is able to apply their knowledge and understanding directly to the context provided although one or two opportunities are missed. Evidence/examples are for the most part implicitly relevant to the\
explanation.

The candidate provides a sound discussion, the majority of which is focused. Evaluative comments are for the most part appropriate, although one or two opportunities for development are missed.

There is a line of reasoning presented with some structure. The information presented is in the most part relevant

12 (AO1.1) (2), (AO1.2) (2), (AO2.1) (3), (AO3.3). (5)

and supported by some evidence.

**Mark Band 1-Low Level (1-4 marks)** The candidate demonstrates a basic knowledge of CISC or RISC; the material is basic and contains some inaccuracies. The candidate makes a limited attempt to apply acquired knowledge and understanding to the context provided.

The candidate provides a limited discussion which is narrow in focus. Judgments if made are weak and unsubstantiated. The information is basic and communicated in an unstructured way. The information is supported by limited evidence and the relationship to the evidence may not be clear.

**0 marks**\
No attempt to answer the question or response is not worthy of credit.
'''
guidance = '''
AO1\
CISC is a complex instruction set. The traditional approach to processor design. Lots of instructions available although some instructions in CISC will rarely get used. RISC is a reduced instruction set. A smaller number of instructions available, several instructions can be combined to perform the same tasks as CISC processors. RISC instructions are used regularly.\
RISC has fewer transistors/less complex circuitry whereas CISC integrated circuits are more expensive/complicated. RISC instructions take one cycle whereas CISC may take several. RISC can only do complex things by combining multiple instructions whereas CISC is done in one line. Compilers for RISC need to be more complex than compilers for CISC

AO2\
CISC processors would run the same software as the desktop machines. Would be less power efficient and require larger battery and cooling mechanisms. More expensive to purchase.\
RISC processor requires software to be written specifically for it (cannot use CISC instructions). More power efficient and so requires less/no cooling and smaller battery/longer battery life. RISC devices may require greater RAM as programs tend to be larger than their CISC equivalents.

AO3\
Mobile use of CISC would save money on software and increase compatibility but cost more to purchase and be physically larger (heat sink/larger battery) and/or have a shorter battery life.\
RISC would require investment in software but be cheaper to purchase and give a better performance out of the office (lighter/longer battery life). Some\
compatibility issues may be reduced with emulators and translators.

**Examiner’s Comments**\
Many candidates were able to discuss the difference in reduced or complex instruction sets and gave some discussion of the increase in hardware requirements for CISC. Few talked about the software differences, and some assumed the charity would need to be programming the devices which was not relevant to the question.
'''

