[[question]]
number = 1
marks = 1

[[question.part]]
label = "1"
marks = 1
text = '''
Application software is run on thin client computers. A thin client computer is a very low-powered computer connected to a powerful central server. The operating system and all the applications run within a virtual machine on the server. The thin client computer will only display the output of the virtual machine and capture and send input to the virtual machine.

State **one** advantage of running the application software within the virtual machine.
'''

[[question.mark_scheme]]
label = "1"
marks = 1
answer = '''
1 mark for:

- Reduced hardware is needed on computers / reduced hardware costs
- Improved security by keeping all software running from one physical device
- Easier/cheaper to manage as only one physical device runs the programs.
- Can add/remove resources/memory/processes to the VM
- If it is infected by malware it can be deleted and recreated / the rest of the system isn’t affected/is protected against malware
- No direct access to hardware
- Resources can be used more flexibly between the machines
'''
guidance = '''
**Examiner’s Comments**

There were some good responses to this question with many giving the response that Malware would not affect the server. Some talked about being able to try out different operating systems which was not relevant to this scenario.
'''

