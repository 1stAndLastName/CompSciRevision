[[question.mark_scheme]]
label = "4(d)"
marks = 3
answer = '''
- Interrupt checked for at start/end of each fetch-execute cycle
- If the interrupt is of a lower/equal priority to the current process then the current process continues
- (If interrupt raised) contents of **registers** copied to stack

- Flags are set to determine if interrupts are enabled / disabled
- Program counter changed to point to Interrupt Service Routine (ISR) / ISR runs
- After interrupt complete, previous **register** values restored back from stack
- Flag is reset
- If higher priority interrupt received during servicing of interrupt…
- …this is added to stack and new interrupt dealt with
'''
guidance = '''
**Examiner’s Comments**

Many candidates were able to gain full marks on this question. Unfortunately, some candidates showed a lack of detail in their answers. Some candidates talked about interrupts being run during an FDE cycle or assumed that an interrupt would be

run immediately with no reference to priorities.

