- Paging uses fixed size memory blocks….
- …. Segmentation uses variable length memory blocks
'''
guidance = '''
Answer must cover paging and segmentation for 2 marks.

Do not accept data instead of memory

**Examiner’s Comments**\
To get both marks, candidates need to be clear that paging and\
segmentation are about allocating memory. Many candidates were not clear on this and discussed managing data or packets. Candidates should be careful to use the correct terminology for questions of this type in particular.
'''

