[[question.mark_scheme]]
label = "4(e)"
marks = 9
answer = '''
**Mark Band 3 – High Level (7–9** **marks)**\
The candidate demonstrates a thorough knowledge and\
understanding of memory\
management carried out by operating systems. The material is generally accurate and detailed.

The candidate is able to apply their knowledge and understanding directly and consistently to the context provided. Evidence/examples will be explicitly relevant to the explanation.

The candidate is able to thoroughly assess the importance of memory management to an efficient and secure system.

There is a well-developed line of reasoning which is clear and logically structured. The information presented is relevant and substantiated.

**Mark Band 2 – Mid Level (4–6** **marks)**\
The candidate demonstrates reasonable knowledge and understanding of memory\
management carried out by operating systems. The material is generally accurate but at times underdeveloped.

The candidate is able to apply their

knowledge and understanding directly to the context provided although one or two opportunities are missed. Evidence / examples are for the most part implicitly relevant to the explanation.

The candidate makes a reasonable attempt to assess the importance of memory management to an efficient and secure system.

There is a line of reasoning presented with some structure. The information presented is in the most part relevant and supported by some evidence.

**Mark Band 1 – Low Level (1–3** **marks)**\
The candidate demonstrates a basic knowledge of memory management carried out by operating systems; the material is basic and contains some inaccuracies. The candidate makes a limited attempt to apply acquired knowledge and understanding to the context provided.

The candidate provides nothing more than unsupported assertions. Any discussion of the importance of memory management will be vague or lacking detail.

The information is basic and communicated in an unstructured way. The information is supported by limited evidence and the relationship to the evidence may not be clear.

**0 mark**\
No attempt to answer the question or response is not worthy of credit
'''
guidance = '''
The following shows example content that may form part of a candidate’s answer. It is not intended to be an exhaustive resource, nor should a candidate be expected to specifically cover any particular amount of this.

**Knowledge (AO1)**

- Memory management means to ensure that RAM is used efficiently and not wasted
- Removes data not needed anymore (garbage collection), frees up space and allocates memory to applications
- Paging or segmentation may be used to split up memory
- Paging uses fixed size divisions whereas segmentation uses varying size divisions
- Paging is where memory is divided physically
- Segmentation is where memory is divided logically
- Virtual memory may be used when RAM is (almost)full to enable applications to continue to run

**Application (AO2)**

- If RAM is unavailable or full, applications cannot be loaded
- Data transferred out of RAM into virtual memory to free up

space and then transferred back again when needed

- Also includes security so that data stored in memory is not vulnerable
- Memory management is important for a well-running machine. If not, RAM would rapidly run out and fill up with unneeded data/instructions and so no new applications could run
- Paging causes internal fragmentation whereas segmentation causes external fragmentation
- A page table is used to map page location which is slower than a segmentation table
- It is easier for the OS to manage page locations as they can be stored non- contiguously. Segments can be non-contiguous but work better contiguously

**Evaluation (AO3)**

- RAM is much more expensive than secondary storage (per unit/GB) so virtual memory is useful
- rather than having to buy more RAM
- Over use of virtual memory causes slow down and even disk thrashing if pages have to be swapped back and forth too often
- Paging can be more effective because any free memory space can be used to swap data in and out whereas with segments, lots of space will sit unused until a segment the right size is available
- Segmentation errors can cause memory leakage which would cause the system to crash
- Security issues – applications can only access memory allocated to them so (for example) a malicious application cannot access the

memory allocated to a banking app. Also when applications are closed, data is removed before being reallocated so that applications cannot see historic data

**Examiner’s Comments**

Many candidates were able to show an understanding of pages being a fixed size and segments being variable size, but few were able to relate virtual memory to the use of pages and segments and few had an understanding of how they are used. Responses to why it is important tended to be vague. There were a few candidates who talked about compression which was not relevant to the question.
'''

