**Examiner’s Comments**\
This question was generally answered well. Several candidates wrote brand names which was not an acceptable answer. Some candidates gave an example of a utility which was required for Question 2 (b).

To gain both marks, candidates were required to choose a suitable application type which would be useful in the given scenario.

Candidates are reminded not to use brand names for questions of this type.
'''

