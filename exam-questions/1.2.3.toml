numDays = 0
total = 0
while not EOF:
    line = SalesFile.readline()
    Sales = Float(line)
    numDays = numDays + 1
    total = total + Sales
endwhile
SalesFile.close()
print("The number days sales are " + Str(numDays))
print("The total sales are " + Str(total))
average = total / numDays
print("The average sales are " + Str(average))
```

Exemplar 3 was given full marks. The candidate has gained the first mark for initialising the variables “numofdays” and “total”. The second mark has been awarded for the first line, which opens the sales file and closing the file after the

loop has finished. The while loop gains the third mark which repeats until the end of the file is reached. The fourth mark is awarded for reading each line of the file correctly. The fifth mark correctly increases total in each iteration. Sale has been correctly converted to a “float” data type beforehand to make this possible. The sixth mark is awarded for calculating the average on the penultimate line. The final mark is awarded for printing the number of days, total sales and the daily average. This has been concatenated correctly with a plus symbol. Some candidates used the comma which was also acceptable.

The syntax provided in this example relates to Python whereas some candidates wrote pseudocode or another high-level language. Some candidates lost marks for writing the steps in everyday English which is not what the question stipulated.
