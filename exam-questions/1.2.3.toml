guidance = '''
AO1\
The spiral model has four quadrants (determine objectives, identify and manage risk, develop and test, plan next iteration). Client feedback then informs future development and prototypes which feedback into future revisions. Waterfall has a structured analysis/design/development/test flow. Progress to the next step is not made until the previous step is completed.

AO2\
The spiral model relies on frequent client

feedback. Spiral produces functional prototypes where features are added incrementally. Spiral model has more focus on risk; projects may be modified or even dropped if risk is too great. Waterfall is much more structured and very reliant on getting the definition of requirements correct at the start; changes are harder to add in at a later stage. However, this forces the definition to be well understood.

AO3\
Spiral involves client feedback, prototypes and evolving projects. Better option where\
requirements may change. Waterfall is better where requirements are very clear to begin with and outcomes known. Spiral is better for risk management. If the programmer has a large team then waterfall may be more appropriate due to the clearly defined responsibilities at each stage.

