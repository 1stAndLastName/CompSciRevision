[[question]]
number = 1
marks = 5

[[question.part]]
label = "1"
marks = 5
text = '''
OCR DogCare look after dogs while their owners are at work. They use a program developed in an object- oriented paradigm to store details about each dog.

Each dog is declared by using an instance of the class `Dog`. This has these private attributes:

```
• name
• breed
• height
• weight
```

The constructor method sets all the attributes to the values passed in as parameters.

Write pseudocode or program code to define the class `Dog`. You should include the attributes and constructor method.

You **do not** need to write the set or get methods.
'''

[[question.mark_scheme]]
label = "1"
marks = 5
answer = '''
1 mark per bullet to max 5:

- Suitable logic for class dog declaration
- Suitable logic to define the 4 (private) attributes: `name,`

```
breed, height, weight
```

- Suitable logic to declare a public method for constructor (e.g. new or class name)...
- ....taking only 4 different parameters in any order.
- Suitable logic to set the values of each attribute

MP4 - if it is obvious the candidate has used Pythonic syntax: allow the additional 5th parameter representing the object e.g. `self, turtle` but this must be the **first** parameter listed.

MP2 - If they have done the above BP2 can be considered implicitly met (Python doesn’t require attributes to be declared outside the constructor)
'''
guidance = '''
Mark in a vertical line against each MP.

Ignore data types in attribute names

Allow colon/empty brackets at the end of class def

**Example Solutions**\
Pseudocode style

```
class Dog
private name
private breed
private height
private weight
public procedure new
(nameIn,
breedIn, heightIn, weightIn)
name = nameIn
breed = breedIn
height = heightIn
weight = weightIn
endclass
```

Java / C# Style\
Class Dog

```
{
private String name
private String breed
private float height
private float weight

public void Dog(String name,
String
breed, float height, float
weight)
{
this.name = name
this.breed = breed
this.height = height
this.weight = weight
}
}
```

Python Style

```
class Dog:
```

```
def __init__(self, name,
breed, height, weight):
self.name = name
self.breed = breed
self.height = height
self.weight = weight
```

**Examiner’s Comments**

There were a range of responses to this question with the most common responses being written in\
pseudocode or python. There was a clear division between candidates who were comfortable writing Object Oriented Programming (OOP) code and class constructors and those that were not.

Less successful candidates with little OOP experience often confused the class declaration with the constructor declaration. A few input the values rather than setting the attributes to the values passed in the parameters.
'''

[[question]]
number = 2
marks = 9

[[question.part]]
label = "2"
marks = 9
text = '''
An embedded system is often a small device that is designed to carry out a limited number of specialised tasks. Professional athletes sometimes wear small embedded systems called fitness trackers in their shirts. These can be used to track their speed, position, heart rate and other performance data during an event. The tracker transmits this data to a pitch-side server which collates the data from all the athletes.

The fitness trackers will send athletes' performance data to a pitch-side server. A program needs to be developed to analyse this data and display the results.

Different words, colours and charts will be displayed to indicate how well athletes are performing.

The program will be used by athletes from different cultures all over the world.

Discuss the layout considerations that the programmer needs to consider when creating the program user interface for different cultures.

You should include the following in your answer:

- layout considerations
- colour considerations
- character set considerations.
'''

[[question.mark_scheme]]
label = "2"
marks = 9
answer = '''
**Mark Band 3-High Level (7-9 marks)** The candidate demonstrates a thorough knowledge and\
understanding of each of the cultural issues. The material is generally accurate and detailed.

The candidate is able to apply their knowledge and understanding directly and consistently to the context provided. Evidence/examples will be explicitly relevant to the explanation.

There is a well-developed line of reasoning which is clear and logically structured. The information presented is relevant and substantiated.

A mark band 3 answer will cover all three points relating to layout, colour and character sets and the cultural impacts of these on the design of the program. The examples will be relevant to the pitch-side program and the needs of the athletes and will go on to evaluate why it is important to

ensure these considerations are made.

**Mark Band 2-Mid Level (4-6 marks)** The candidate demonstrates reasonable knowledge and\
understanding of most cultural issues; the material is generally accurate but at times underdeveloped.

The candidate is able to apply their knowledge and understanding directly to the context provided although one or two opportunities are missed. Evidence/examples are for the most part implicitly relevant to the explanation.

There is a line of reasoning presented with some structure. The information presented is in the most part relevant and supported by some evidence.

A mark band 2 answer will cover at least two of layout, colour and character sets and will expand the points, relating these to cultural considerations, the pitch-side program and/or the needs of the athletes although these may not be balanced.

**Mark Band 1-Low Level (1-3 marks)** The candidate demonstrates a basic knowledge of some cultural issues; the material is basic and contains some inaccuracies. The candidate makes a limited attempt to apply acquired knowledge and understanding to the context provided.

The candidate provides nothing more than an unsupported assertion.

The information is basic and communicated in an unstructured way. The information is supported by limited evidence and the relationship to the evidence may not be clear.

A mark band 1 answer will contain some basic, relevant points related to layout, colour and/or character sets. It may not be linked to cultural considerations or the context of the pitch-side program or athlete’s needs.

**0 mark**\
No attempt to answer the question or response is not worthy of credit.
'''
guidance = '''
Points may include but **aren’t limited** **to**:

**AO1 Knowledge and**\
**Understanding**Accessibility, colour blindness etc are not relevant to context.

Cultural issues are about how different groups of people with particular beliefs, practices or languages may be affected by something.

The layout is an important factor to consider. This will determine where items will be placed on the screen. Where items are placed on the screen can massively impact how easily people can use them. The layout which is suitable for one country may not be suitable for another.

Colour should be carefully considered. Humans have their own personal perception of different colours and will use this to determine what it means.

Colour can be used to confirm messages to the audience, e.g. if our interactions with the software has been successful or not. However, colours can mean different things in different cultures.

A character set is a list of characters that can be recognised by the hardware and software. There are various different character sets such as ASCII and UNICODE.

**AO2 Application**\
Western audiences will often read from left to right and top to bottom. However, other countries around the world read from right to left. Athletes are from around the world and this needs to be considered.

Traditionally, green often indicates that something is positive or that an interaction with the computer has been successful. Red often indicates something negative or that an interaction with the computer has not been successful. However, these colours may have different meanings and could be seen as offensive in different cultures. Designers therefore need to ensure they don’t offend any particular culture as the app is for international athletes.

There are many different character sets. The ASCII character set can only represent 128/256 characters which would be suitable for English and European languages. However, this would not be a suitable character set for other world-wide languages and if used, it would mean that characters could not be displayed which would affect the athletes’ use of the app.

**AO3 Evaluation**\
As the software is being used by different cultures, it is important that the user interface can be used and understood by all audiences otherwise people may choose not to use the fitness trackers e.g. using icons rather

than words could be more universally understood by the athletes.

The programmer needs to consider the typical layout, colours and characters used in different cultures and ensure these are taken into consideration to ensure that groups of people are not offended and will still understand the words, data and charts.

Designers could release different versions of the software for different parts of the world or make sure the program has the ability for settings to be changed to overcome any potential issues and allow the athletes to customise their experience.

**Examiner’s Comments**

There were a good range of Level 2 responses with good discussions for at least two of the bullet points and related to different cultures. Some candidates were unable to apply their knowledge to different cultures and instead discussed accessibility concerns. The candidates with Level 3 responses gave good discussions of all three bullet points and related it to different cultures and the athletes. They were also able to discuss how the programmer could go about this.

*[Image in the original mark scheme, not shown here.]*

**Assessment for learning**

Candidates should be aware that in level of response questions application of knowledge to the scenario is needed to get into the Level 2 and Level 3 mark bands.
'''

