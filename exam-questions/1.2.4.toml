guidance = '''
AO1Immediate addressing is where the operand holds the actual data to be used; no address referenced Direct addressing is where the operand holds the address that holds the data to be used.\
Indirect addressing is where the operand holds an address which is where the data to be used is stored Indexed addressing is where the operand holds an address which is offset using the Index Register to find the true address of the data to be used

AO2\
Immediate addressing; operand of 27 would refer to the value 27\
Direct addressing; operand of 27 would tell the processor to fetch the data held at address 27.\
Indirect addressing; operand of 27 would tell the processor to fetch the data held at address 27, which itself would then be used an address to fetch data from.\
Indexed addressing; operand of 27 would be added to the value of the Index register and this would then be used as the address to fetch data from.\
AO3\
Immediate addressing allows simple access to data with no fetch required, but limited by the data size of the operand.\
Direct addressing allows data to be fetched from memory. Data can potentially be larger in size that with immediate addressing but address range limited by size of operand. Indirect addressing allows a larger range of addresses to be accessed as address fetched. However, multiple fetches required to access data. Indexed addressing allows the Index register to be manipulated to access data stored sequentially e.g. in an array.
'''

