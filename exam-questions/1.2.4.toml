**Examiner’s Comments**

Most candidates were able to gain at

least one mark for the first output on this question with many gaining full marks. A small minority of candidates simply copied the outputs given in the question stem.
'''

[[question.mark_scheme]]
label = "3(a)(ii)"
marks = 4
answer = '''
1 mark for each correct line.

```
START      LDA      MAX
  BRZ      END
  LDA      A
  OUT
```

**LDA B**

```
STA      TEMP
```

**LDA A**

```
ADD      B
