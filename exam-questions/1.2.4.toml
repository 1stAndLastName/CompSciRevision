text = '''
The Fibonacci sequence is a series of numbers. It starts with the number 0 and then 1. Each number after that is a sum of the two numbers before it.

The first seven numbers in the series are:\
0\
1\
1 (i.e. 1 + 0)\
2 (i.e. 1 + 1)\
3 (i.e. 1 + 2)\
5 (i.e. 2 + 3)\
8 (i.e. 3 + 5)

Orla has written some code to show the first five numbers in the Fibonacci sequence (0,1,1,2,3) using the Little Man Computer (LMC) instruction set.

The LMC code that Orla has written contains an error.

```
START         LDA         MAX
  BRZ         END
  LDA         A
  OUT
  ADD         B
  STA         B
  LDA         B
  STA         A
  LDA         MAX
  SUB         ONE
  STA         MAX
  BRA         START
END           HLT
A             DAT         0
B             DAT         1
MAX           DAT         5
 ONE           DAT         1
```
'''

[[question.part]]
label = "3(a)(i)"
marks = 3
text = '''
State the **five** outputs that Orla's code would give.

Output 1

Output 2

Output 3

Output 4

Output 5
'''

[[question.part]]
label = "3(a)(ii)"
marks = 4
text = '''
Orla has rewritten her LMC code to fix the error and added an additional `DAT`.

Complete the LMC code to output the first five correct numbers in the Fibonacci sequence (0,1,1,2,3).

```
START               LDA              MAX
  BRZ              END
  LDA              A
  OUT
    ……
  STA              TEMP
  ……
  ADD              B
  STA              B
   ……
```

```
  STA              A
  LDA              MAX
  SUB              ONE
  STA              MAX
  BRA              START
END                 HLT
A                   DAT              0
B                   DAT              1
…… DAT              0
MAX                 DAT              5
 ONE                 DAT              1
```
'''

