guidance = '''
AO1\
Object oriented programming makes use of classes (templates) from which objects are made.\
Classes have attributes and methods Classes can be encapsulated by making attributes private and providing public access methods\
Object oriented programming supports inheritance which allows classes to use attributes and methods of parent classes.\
Object oriented programming supports polymorphism meaning that class attributes and methods can take on many different forms if required.

AO2\
OO approach would call on classes per type of player or enemy object Objects made from these classes, so one enemy class may generate many enemy objects, each with different values for their attributes (e.g. speed, energy)\
Special types of Player or Enemy objects could be instantiated from classes that inherit from the original Player/Enemy classes, but have attributes/methods of their own.

Polymorphism would allow for the attributes/methods of Player/Enemy objects to behave differently from normal if required.

AO3\
OO promotes a modular approach (procedural through use of\
subroutines, OO through classes). OO is an abstraction of a real world problem, with classes for each type of things to be modelled and objects for each instance of these.\
OO has advantages in data security in that encapsulation forces\
developers/users to use methods (with their built in validation) to access/amend data stored in attributes.\
OO has advantages in efficiency of design where classes can be reused and can inherit from one another. Procedural programming struggles to support this.\
OO also offers flexibility through polymorphism.
'''
