marks = 1
text = '''
State which method of compression is most likely to be used for this purpose.
'''

[[question.part]]
label = "4(ii)"
marks = 2
text = '''
Explain the need to compress photographs in this situation.

**END OF QUESTION PAPER**
'''

[[question.mark_scheme]]
label = "4(i)"
marks = 1
answer = '''
Lossy
'''

[[question.mark_scheme]]
label = "4(ii)"
marks = 2
answer = '''
1 mark per bullet up to a maximum of 2 marks, e.g.:

- Reduces the size of the image file
- Uses lower bandwidth in transmission
- Takes up less storage (on the HTTP server)
'''
