[[question]]
number = 1
marks = 8

[[question.part]]
label = "1(a)"
marks = 2
text = '''
A company wants more customers to be able to find their website on the internet.

When customers contact the company, their computers will use a number of protocols such as TCP/IP and HTTP to make connections with other devices over the internet.

Explain what a protocol is and why they are important in network communications.
'''

[[question.part]]
label = "1(b)"
marks = 6
text = '''
Describe **three** different pieces of networking hardware in a client-server network apart from the clients and servers themselves.

1

2
'''

[[question.mark_scheme]]
label = "1(a)"
marks = 2
answer = '''
1 mark per bullet to max 2:

1 mark for:

- A set of rules for communication/ transmission/transfer of data between devices

1 mark **max** from:

- The sending system has no direct control over the way the receiving system responds
- Allows standardisation as different devices have different OS/hardware
- Protocols allow for data to be exchanged in a predictable way/ in the correct format
'''
guidance = '''
Not ‘**a** rule’ - must be plural

MP1 not a set of **instructions**

MP1 accept **standards / an agreement**

**Examiner’s Comments**

Most candidates were able to explain that a protocol is a set of rules for communication between devices. Few then went on to explain what that meant and so the majority of candidates gained one mark.
'''

[[question.mark_scheme]]
label = "1(b)"
marks = 6
answer = '''
1 mark for hardware and 1 mark for expansion to 6 marks max

- **Router** e.g.
- Connect networks together
- Assign IP address to devices
- Examines data packets and forwards them

- **Cable/ Ethernet** e.g.
- Carries digital data from one device/NIC to the next
- Connects wired devices to the network

- **Gateway** e.g.
- Connects different types of network
- Translates protocols from one network to another

- **Bridge** e.g.
- Connects different network segments

- **Repeater**
- Receives a signal and retransmits it

- **Network Interface** **Card / NIC** e.g.
- Gives each device a MAC address / unique ID
- Allows a computer system to interface with a network

- **Wireless Access** **Point / WAP** e.g.
- Allows wireless devices to communicate with each other
- Sends and receives radio waves
- Examines data packets and forwards them

- **Switch** e.g.
- Connects multiple wired devices to the network
- Receives data and forwards it to the intended recipient
- Examines data packets and forwards them
- Routes based on MAC addresses

- **Hub** e.g.
- Receives data from a device and broadcasts it to **all**

devices connected to it

- **Modem** e.g.
- Changes a signal from digital to analogue

- **Firewall** e.g.
- Filters traffic coming in and out of a network
'''
guidance = '''
2 marks max each.

Allow any suitable expansion.

Mark in pairs.

Allow:\
**Proxy server** e.g.

- Sits between user and computer to route requests through an external server
- Creates separation between a user and the site/service
- Protects your security/anonymity by hiding IPs

**Examiner’s Comments**

The majority of candidates could give three different pieces of networking hardware but many were unable to

then describe what they did with many putting connects devices for the description of each piece of hardware.
'''

