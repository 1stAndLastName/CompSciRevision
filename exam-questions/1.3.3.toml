[[question]]
number = 3
marks = 13

[[question.part]]
label = "3(a)"
text = '''
Zac has an accountancy business. He is moving into an office that has enough space for up to five members of staff. Zac would like to install a Local Area Network (LAN) to allow his staff to work together.
'''

[[question.part]]
label = "3(a)(i)"
marks = 2
text = '''
A LAN uses packet switching.

Describe **one** difference between packet switching and circuit switching.
'''

[[question.part]]
label = "3(a)(ii)"
marks = 2
text = '''
Explain why packet switching is more suitable for a computer network than circuit switching.
'''

[[question.part]]
label = "3(b)"
marks = 9
text = '''
Zac has hired a company that will advise him on what type of LAN he should set up.

Discuss how Zac could set up a peer-to-peer network and a client-server network.

You should refer to the following in your answer:

- how the computers in each type are connected
- the benefits of each type
- the drawbacks of each type
- the suitability of each type.
'''

[[question.mark_scheme]]
label = "3(a)(i)"
marks = 2
answer = '''
`o` In circuit switching dedicated hardware resources are used for each connection `o` In packet switching hardware is used for multiple different connections.

`o` In circuit switching the data is sent along one route/stream. `o` In packet switching packets of data may be sent along multiple different routes/packets

may not be in order

- Circuit switching is less secure if data is intercepted
- Packet switching, data is more secure if intercepted/not all packets will be intercepted
'''
guidance = '''
Marks answers in pairs

**Examiner’s Comments**

Many candidates achieved both marks for this question with most of the responses describing the different routes taken by the data. The candidates who did less well on this question did not understand differences between packet switching and circuit switching.
'''

[[question.mark_scheme]]
label = "3(a)(ii)"
marks = 2
answer = '''
- Computer networks would involve multiple connections happening concurrently
- In packet switching hardware is not tied up with each unique connection / can handle multiple connections simultaneously
- Computers pass vast amounts of data which may encounter transmission errors
- Packet switching means only resending individual packets instead of the whole data stream
- Computers may be transmitting business critical data
- Packet switching means any network hardware failures can be mitigated by routing around it.
'''
guidance = '''
**Examiner’s Comments**

Many candidates lost marks for the second part of Question 6 (a) (ii), despite achieving both marks for the first part 6 (a) (i). A lot of incorrect answers gave a very similar response to the first part of the question instead of explaining why the differences that packet switching has, make it more suitable for a computer network. Common correct answers explained that packet switching can route around hardware failures as the data is not sent along a single route.
'''

[[question.mark_scheme]]
label = "3(b)"
marks = 2
answer = '''
**Mark Band 3–High Level** **(7–9 marks)**\
The candidate demonstrates a thorough knowledge and understanding of both peer to peer and client server and can give valid application of both in this scenario. All

detail are generally accurate and relevant.\
The candidate is able to apply their knowledge and understanding directly and consistently to the context provided. Evidence/examples will be explicitly relevant to the explanation.

There is a well-developed line of reasoning which is clear and logically structured. The information presented is relevant and substantiated.

**Mark Band 2-Mid Level** **(4–6 marks)**\
The candidate demonstrates reasonable knowledge and understanding of client server and peer to peer; the material is generally accurate but at times underdeveloped. The candidate may not have applied both to this scenario. The candidate is able to apply their knowledge and understanding directly to the context provided although one or two opportunities are missed.\
Evidence/examples are for the most part implicitly relevant to the explanation.

There is a line of reasoning presented with some structure. The information presented is in the most part relevant and supported by some evidence.

**Mark Band 1-Low Level** **(1–3 marks)**\
The candidate demonstrates a basic knowledge of client/server or peer to peer and has made some attempt at applying this knowledge. the material is basic and contains some inaccuracies. The candidate makes a limited attempt to apply

acquired knowledge and understanding to the context provided.\
The candidate provides nothing more than an unsupported assertion.

The information is basic and communicated in an unstructured way. The information is supported by limited evidence and the relationship to the evidence may not be clear.

**0 mark**\
No attempt to answer the question or response is not worthy of credit.
'''
guidance = '''
AO1\
P2P:

- Each computer can act independently
- Each computer is responsible for it’s own security and login
- Each computer will maintain and possibly share its own connected hardware (printer/external storage/internet connection)

- Each computer will maintain and possibly share its own secondary storage
- If a computer is powered down it’s shared resources will not be available.
- There are no resources not shared by a peer machine
- Adding a machine is simple
- Very little administration is needed

Client Server:

- All network functionality can be provided by servers.
- A server is a process running on a machine, usually dedicated to providing these services.
- A server machine is designed to never be powered down.
- Login/security is handled centrally
- Shared storage may be managed by a server
- Shared resources (printer/internet connection etc) my be managed by a server
- If a server process or machine fails, network functionality, including the ability login is lost
- Adding a new machine can mean installing specialist client software and setting up OS policies.
- IT skills and a lot of time are needed to administer a client server network

AO2\
P2P:

- As Zak is looking to expand his staff, P2P would offer flexibility in adding staff ad hoc.
- Zak’s company is still small and may struggle to pay for the IT administrator skills needed for a client server

Client Server:

- As Zak’s firm is an accountancy firm it will have sensitive customer data
- Client server would allow stronger centralised security
- As Zak is taking on multiple staff, they may wish to work collaboratively, which shared storage would allow.
- Zak could share a single printer/other hardware with all staff and not worry about an individual computer being switched on.

AO3: Candidates can conclude either method, but to score in the top MB must have a clear line of reasoning to justify their choice.

**Examiner’s Comments**

Candidates were assessed on the quality of their extended response in this question. Although most candidates were able to give a few advantages and disadvantages of the different types of network, few made suitable links to the scenario.

Some candidates discussed different topologies which was not relevant to the question. Candidates that were given high marks for this question focused more on the scenario, and made clear links between this and the benefits and drawbacks of the different solutions.

