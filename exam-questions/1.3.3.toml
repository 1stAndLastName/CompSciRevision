'''

[[question.mark_scheme]]
label = "4(i)"
marks = 5
answer = '''
- Protocol to be used is decided based on the application
- E.g. HTTPS **for** **browser based** **service** / SMTP/IMAP **for messaging** **service**
- Adds encryption
- Passes on to transport layer to **send**
- Gets data from transport layer **when** **receiving**
- Unpacks message ready for display / removes headers or other non-viewable data
- Decrypts message
'''
guidance = '''
For BP2, don’t allow HTTP (question mentions\
encryption). Don’t allow a list of protocols which aren’t relevant to the question. Don’t allow a protocol without its use

**Examiner’s Comments**\
Very few students could explain what happens at the application layer and answers tended to be about splitting data into packets. Some candidates did mention that encryption would take place but didn’t go on to mention decryption when receiving data. Those candidates that identified that protocols are applied here were unable to give a specific example and simply listed protocols they knew, but without context.
'''

[[question.mark_scheme]]
label = "4(ii)"
marks = 2
answer = '''
- Receives (layered) data from internet layer **to send**
- MAC addresses are added to the packet
- Passes and receives data across wireless network (to WAN / other machine)
- Passes (layered) data back up to internet layer **when receiving**
'''
guidance = '''
Wireless access given in question stem

**Examiner’s Comments**\
Very few candidates were able to gain 2 marks on this question. Some candidates talked about transmitting data via cables, despite wireless being mentioned in the question.
'''

