Mark first answer in each answer space

If mentioned one protocol with 2 versions e.g. IPv4 & IPv6

- only 1 mark

If they’ve written the protocol in full but got any word wrong, no mark awarded

**Examiner’s Comments**

Generally well answered and it was interesting to see the different protocols candidates were able to name. Some candidates named two of the layers in TCP/IP instead of protocols which gained them no marks.
