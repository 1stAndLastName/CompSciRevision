text = '''
A company wants more customers to be able to find their website on the internet.

The company would like to start selling their products on their website. They will use both client side and server side processing to do this.

Tick (✓) **one** box on each row to identify whether each task would be best performed on the client side or the server side.

| **Task** | **Client Side** | **Server Side** |
|---|---|---|
| Loading the website HTML code |   |   |
| Applying CSS styles to a website |   |   |
| Running JavaScript code to check that the customer surname has been entered on the order form |   |   |
| Running queries on the database to check if an item is available in stock |   |   |
'''

[[question.part]]
label = "1(b)"
marks = 12
text = '''
Discuss why search engine indexing and page ranking will be important in achieving this.

You should include the following in your answer:

- what search engine indexing means and what information is collected
- what PageRank means and possible factors that can affect a PageRank score of a website
- possible ways for the company to improve the PageRank score of pages on its website.
'''

[[question.mark_scheme]]
label = "1(a)"
marks = 4
answer = '''
1 mark for each correct row.

| **Task** | **Client Side** | **Server Side** |
|---|---|---|
| Loading the website HTML code | ✓ |   |
| Applying CSS styles to a website | ✓ |   |
| Running JavaScript code to check that the customer surname has been entered on the order form | ✓ |   |
| Running queries on the database to check if an item is available in stock |   | ✓ |
'''
guidance = '''
Accept alternatives to ticks in the boxes so long as it is clear which side is marked.

**Examiner’s Comments**

Most candidates were able to gain 2 or 3 marks on this question with many gaining all 4 marks. The most common error was ticking server side for Running JavaScript to check the surname.
'''

[[question.mark_scheme]]
label = "1(b)"
marks = 12
answer = '''
**Mark Band 3-High Level (9-12 marks)**\
The candidate demonstrates a thorough knowledge and understanding of search indexing and page rank. The material is generally accurate and detailed.

The candidate is able to apply their knowledge and understanding directly and consistently to the context provided. Evidence/examples will be explicitly relevant to the explanation.

The candidate is able to assess the extent to which page rank and search engine optimization is important to online visibility.

There is a well-developed line of reasoning which is clear and logically structured. The information presented is relevant and substantiated.

A mark band 3 answer will explain in detail how search indexing happens and the factors affecting PageRank scores. There will be clear evaluative points that identify how to improve PageRank score.

**Mark Band 2-Mid Level (5-8 marks)** The candidate demonstrates reasonable knowledge and understanding of search indexing and page rank; the material is generally accurate but at times underdeveloped.

The candidate is able to apply their knowledge and understanding directly to the context provided although one or two opportunities are missed.

Evidence/examples are for the most part implicitly relevant to the explanation.

The candidate makes a reasonable attempt to come to a conclusion as to why page rank and search engine optimisation are important to online visibility.

There is a line of reasoning presented with some structure. The information presented is in the most part relevant and supported by some evidence.

A mark band 2 answer will cover both search indexing and page ranking and will expand the points, explaining what information is collected during indexing and factors that affect PageRank scores although these may not be balanced. There should be some attempt to identify how to improve PageRank score.

**Mark Band 1-Low Level (1-4 marks)**\
The candidate demonstrates a basic knowledge of search indexing or page rank; the material is basic and contains some inaccuracies. The candidate makes a limited attempt to apply acquired knowledge and understanding to the context provided.

The candidate provides nothing more than an unsupported assertion.

The information is basic and communicated in an unstructured way. The information is supported by limited evidence and the relationship to the evidence may not be clear.

A mark band 1 answer will contain some basic, relevant facts about what search indexing is and/or what PageRank means. They may not discuss how the company can improve PageRank.

**0 mark**\
No attempt to answer the question or response is not worthy of credit.
'''
guidance = '''
Points may include but aren’t limited to:

**AO1 Knowledge and** **Understanding**\
Search engine indexing:

- Search engine indexing is where a database of key words is kept with links to relevant pages stored with the keyword
- Words are stored along with their position on a page
- Bots (spider/crawlers) will “crawl” the web finding web pages and looking for key words on them
- The will navigate from page to page following hyperlinks
- They are then sent back to the search engine’s database
- When you search for a website, you are not searching on the web, you are searching in the

search providers database

PageRank:

- Used to find and rank website pages and then list the results in a search engine. If a website has a higher score, it will appear higher in the list of search results.
- More links from more important pages, ranks a page higher
- Stored as a weighted, directed graph `o` Pages are nodes `o` Hyperlinks are edges in one direction `o` Weightings are calculated by page rank

**AO2 Application**\
To get more of presence they will need to...

- Make effective use of meta tags that effectively describe the contents of the website.
- Make effective use of H1 tags using suitable headings that describes the content of the website
- Increase the number of quality of incoming links from other websites, ideally those with a high PageRank score themselves
- Increase the number of outgoing links
- Key words can be stored in meta tags, title tags or header tags (h1, h2 etc)
- Damping factor is used to quash a PageRank based on the idea that a

user will only click through a certain number of links

**AO3 Evaluation**

- PageRank algorithm is only one algorithm that is used to Rank websites.
- To get a better presence on the internet, the company will need to consider who links to their page, the more popular the better
- They could potentially work with other companies who have established websites and get incoming links from those sites
- It’s important that a company ensures their site is malware free/secure as this can impact on their PageRank score

**Examiner’s Comments**

Many candidates were able to discuss some factors that affect PageRank and how the website could improve it. Far less were able to discuss search engine indexing correctly. Some were able to apply their knowledge to the scenario. More successful candidates were able to give a good description of both search engine indexing and PageRank as well as relevant suggestions for how the website could improve their PageRank.
'''

