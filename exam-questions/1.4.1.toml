A programmer creates another function to count and return how many capital letters are in a string that is passed into the function as a parameter.

The `asc()` function takes in a character and returns its ASCII value. For example `asc("A")` returns 65. Capital letters have ASCII values between 65 and 90 inclusive.
'''

[[question.part]]
label = "6(i)"
marks = 3
text = '''
Complete the function below.

```
function countCapitals(text)
  / initialise counter to 0
  capCount = 0
  / loop through each character in the string passed in
  for x = 0 to text.length-1
     c = text.subString(x, 1)
     / check if character is a capital
     if asc(c) >= 65 ……
       / if so, increment counter
       ……
     endif
  next x
  ……
endfunction
```
'''

[[question.part]]
label = "6(ii)"
marks = 1
text = '''
Give **one** similarity between ASCII and Unicode.
'''

[[question.part]]
label = "6(iii)"
marks = 2
text = '''
Give **two** differences between ASCII and Unicode.

Difference 1

Difference 2
'''

[[question.mark_scheme]]
label = "6(i)"
marks = 3
answer = '''
```
function countCapitals(text)
  / initialise counter to 0
  capCount = 0
  / loop through each character in
the string passed in
  for x = 0 to text.length-1
    c = text.subString(x, 1)
    / check if character is a
capital
    if asc(c) >= 65 and asc(c) <= 90
/ if so, increment counter
      capCount = capCount + 1
    endif
  next x
  return capCount
endfunction
```
'''
guidance = '''
Accept alternative answers in high-level languages (e.g. `capCount ++` or `capCount +=1 / &&` for `and` for BP1)

Accept `countCapitals = capCount` for BP3 (Returning via assigning to function identifier is used in VB / Pascal)

Accept **and asc(c) \< 91** instead of **\<=90**

Allow FT for returning the value they increment as a counter if it isn’t capCount
'''

