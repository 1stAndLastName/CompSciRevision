[[question]]
number = 5
marks = 1

[[question.part]]
label = "5"
marks = 1
text = '''
A bubble sort will sort an array of 50 integer values called `numberArray`.

State why the integer values are stored in an array instead of separate variables.
'''

[[question.mark_scheme]]
label = "5"
marks = 1
answer = '''
1 mark for:

- Can refer to all 50 only using one identifier / all values can be indexed in one array
- The numbers can be passed as a single parameter
- Does not need 50 variables to be declared/passed
'''
guidance = '''
**Examiner’s Comments**

The concept of having a single indexable identifier seemed to be poorly understood with few candidates gaining the mark. While many candidates understood that an array can be iterated through, they did not link this to the fact that elements in an array are indexable. Similarly, unqualified points such as ‘an array is easier to sort’ were not given marks for the same reason.

There was a common misconception that an array would use far less memory space than 50 separate variables. There would be minimal difference since each separate value would take the same amount of storage space as the corresponding value in an array. The only overhead for separate variables would be the extra pointers to the memory locations for each, compared to one pointer for an array.
'''

