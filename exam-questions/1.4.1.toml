[[question.mark_scheme]]
label = "2(b)"
marks = 2
answer = '''
**Mark Band 3 - High Level** **(7-9 marks)**\
The candidate demonstrates a thorough knowledge and\
understanding of why data is stored in binary with points covering a range of examples of data types. All detail is generally accurate and relevant.\
The candidate is able to apply their knowledge and understanding directly and consistently to the context provided.\
Evidence/examples will be explicitly relevant to the explanation. The candidate will come to a clear conclusion that must be justified by their comments.

There is a well-developed line of reasoning which is clear and logically structured. The information presented is relevant and

substantiated.

**Mark Band 2- Mid Level**\
**(4-6 marks)**\
The candidate demonstrates reasonable knowledge and understanding of why data is stored in binary with points covering a range of examples of data types stored in binary. The material is generally accurate but at times underdeveloped.\
The candidate is able to apply their knowledge and understanding directly to the context provided although one or two opportunities are missed.\
Evidence/examples are for the most part implicitly relevant to the explanation.\
The candidate will attempt to come to a conclusion, although it may not be fully justified by their answer.

There is a line of reasoning presented with some structure. The information presented is in the most part relevant and supported by some evidence.

**Mark Band 1- Low Level** **(1-3 marks)**\
The candidate demonstrates a basic knowledge of why data is stored in binary with points covering some examples of data types stored in binary. The material is basic and contains some inaccuracies. The candidate makes a limited attempt to apply acquired knowledge and understanding to the context provided.\
The candidate provides nothing more than an unsupported assertion.

The information is basic and communicated in an unstructured way. The information is supported by limited evidence and the relationship to the evidence may not be clear.

**0 mark**\
No attempt to answer the question or response is not worthy of credit.
'''
guidance = '''
AO1\
Types of data stored in binary:\
E.g.

- Numeric
- Alphanumeric/text/characters/symbols
- Sound
- Images
- Video

AO2:\
Examples:

- Text - Use of character sets such as ASCII and Extended ASCII. Each character is given a separate binary code. Increasing the number of bits for each character increase the number of possible characters that can be stored
- Numbers - Numbers can be stored using binary. Sign and Magnitude and Two’s Compliment can be used to

store negative binary numbers. Floating Point binary can be used to store data with a decimal point.

Other answers outside of the specification should still be accepted. E.g.

- Images are split into pixels. Each pixel is given a binary value which represents a colour.
- Analogue sound is sampled. A sample is a reading that is taken at certain points and is stored as a binary number.

AO3\
Reasons computers use binary:

- Computers made up of switches/logic gates
- They will have on/off/two states
- This easily translates to binary values

**Examiner’s Comments**

Candidates were assessed on the quality of their extended response in this question. Most candidates were able to explain why computers store data in a binary format and many discussed character sets being used to store test using ASCII and UNICODE. Many candidates also further discussed storing numbers using sign and magnitude and floating point, etc.

Few candidates discussed other points such as sound, video and images being stored in binary, and few mentioned that computers are made up of logic gates/switches.
'''

