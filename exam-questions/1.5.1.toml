[[question.part]]
label = "1(a)"
marks = 3
text = '''
Government bodies have been given additional powers under the Regulation of Investigatory Powers Act.

State **three** additional powers that this law gives to some government bodies.

1

2

3
'''

[[question.part]]
label = "1(b)"
marks = 3
text = '''
An investigative firm wants to start investigating cyber security issues. As part of their new roles, employees will be accessing personal data. In order to facilitate this, all employees are enrolled on a course about the Data Protection Act.

Identify **three** principles of the Data Protection Act.

1

2

3
'''

[[question.mark_scheme]]
label = "1(a)"
marks = 3
answer = '''
1 mark per bullet to max 3:

- Allows for mass surveillance of communications
- Allows the **monitoring** of an individual’s internet activities/history
- Allows covert surveillance to be carried out
- Can demand access to protected data
- Can demand that ISPs/businesses give access to customer communications/history
- Can demand that ISPs/businesses install equipment that facilitate surveillance
- Can demand that encryption keys are handed over / force individuals to decrypt data
- Can keep existence of searches and what found private in court
'''
guidance = '''
Allow other suitable answers relating to examples of other types of surveillance e.g. CCTV, directed surveillance.

MP4 relates to password protected data or accessing data protected under the DPA

**Examiner’s Comments**

There were a number of candidates who could not accurately name one additional power.
'''

[[question.mark_scheme]]
label = "1(b)"
marks = 3
answer = '''
1 mark per bullet to max 3:

- Data must be processed **fairly/** **lawfully**
- Data must be **adequate/** **relevant/ not excessive**
- Data must be **accurate** and (where necessary) **up to date**
- Data must **not be retained for** **longer than necessary**
- Data can only be **used for the** **purpose** for which it was collected
- Data must be **kept secure**
- Data must be **processed in** **accordance with people’s** **rights**
- Data must not be transferred outside of the EU without adequate protection / to other countries who do not have equivalent data protection laws
'''
guidance = '''
Accept: Right to see their own data/change if incorrect

**Examiner’s Comments**

This was generally well answered and candidates showed good understanding of the Data Protection Act (DPA) principles.
'''

