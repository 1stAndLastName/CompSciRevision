answer = '''
**Mark Band 3–High Level (7-9 marks)** The candidate demonstrates a thorough knowledge and understanding of electronic communication monitoring techniques and the social and legal impact of this. The material is generally

accurate and detailed.

The candidate is able to apply their knowledge and understanding directly and consistently to the context provided. Evidence/examples will be explicitly relevant to the explanation.

The candidate provides a thorough discussion which is well balanced. Evaluative comments are consistently relevant and well-considered.

There is a well-developed line of reasoning which is clear and logically structured. The information presented is relevant and substantiated.

**Mark Band 2-Mid Level (4-6 marks)** The candidate demonstrates reasonable knowledge and understanding electronic communication monitoring techniques and the social and legal impact of this; the material is generally accurate but at times underdeveloped.

The candidate is able to apply their knowledge and understanding directly to the context provided although one or two opportunities are missed.\
Evidence/examples are for the most part implicitly relevant to the explanation.

The candidate provides a sound discussion, the majority of which is focused. Evaluative comments are for the most part appropriate, although one or two opportunities for development are missed.

There is a line of reasoning presented with some structure. The information presented is in the most part relevant and supported by some evidence.

**Mark Band 1-Low Level (1-3 marks)** The candidate demonstrates a basic knowledge of electronic communication monitoring techniques and the social and legal impact of this; the material is basic and contains some inaccuracies. The candidate makes a limited attempt to apply acquired knowledge and understanding to the context provided.

The candidate provides a limited discussion which is narrow in focus. Judgments if made are weak and unsubstantiated. The information is basic and communicated in an unstructured way. The information is supported by limited evidence and the relationship to the evidence may not be clear.

**0 marks**\
No attempt to answer the question or response is not worthy of credit.
'''
guidance = '''
AO1\
Encryption means that data is scrambled so that if it is intercepted, it cannot be understood.\
Requires the use of a key to decrypt. Symmetric encryption uses on key

for encrypt/decrypt and so key exchange is problematic.\
Asymmetric encryption uses different keys (public and private) so no need to exchange keys.\
Regulation of Investigatory Powers Act (RIPA) gives authorities the power to compel disclosure of encryption keys

AO2\
Encrypted messages cannot be read by outsiders without the key RIPA gives Police the power to insist on users decrypting messages / handing over the key to allow reading of messages.\
Many messaging services already include end-to-end encryption by default\
Use of VPNs to re-route traffic and attempt to escape monitoring possible\
The ending of encrypted data shows that two parties are passing information they want to keep secret. Techniques like steganography can be used to his the existence of encrypted data.

AO3\
Monitoring communication runs the risk of revealing secret but non-illegal communications\
Restricting encryption means that secure sites (eg banks) may struggle to function\
Legislation (RIPA) already ensures that communications can be monitored if there is just cause Routine monitoring runs the risk of false-positives\
However, will reduce risk of illegal activities being co-ordinated (e.g. terrorism, drug trafficking).
'''
