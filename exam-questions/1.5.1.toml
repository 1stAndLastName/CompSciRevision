marks = 9

[[question.part]]
label = "6"
marks = 9
text = '''
\* “The Computer Misuse Act means that computer users are criminalised for simply trying to learn how systems work.”

Discuss whether or not you agree with this statement.
'''

[[question.mark_scheme]]
label = "6"
marks = 9
answer = '''
**Mark Band 3–High Level (7-9 marks)** The candidate demonstrates a thorough knowledge and understanding of legislation including the Computer Misuse Act. The material is generally accurate and detailed.

The candidate is able to apply their knowledge and understanding directly and consistently to the context provided. Evidence/examples will be explicitly relevant to the explanation.

The candidate provides a thorough discussion which is well balanced. Evaluative comments are consistently relevant and well-considered.

There is a well-developed line of reasoning which is clear and logically structured. The information presented is relevant and substantiated.

**Mark Band 2-Mid Level (4-6 marks)** The candidate demonstrates reasonable

knowledge and understanding legislation including the Computer Misuse Act; the material is generally accurate but at times underdeveloped.

The candidate is able to apply their knowledge and understanding directly to the context provided although one or two opportunities are missed.\
Evidence/examples are for the most part implicitly relevant to the explanation.

The candidate provides a sound discussion, the majority of which is focused. Evaluative comments are for the most part appropriate, although one or two opportunities for development are missed.

There is a line of reasoning presented with some structure. The information presented is in the most part relevant and supported by some evidence.

**Mark Band 1-Low Level (1-3 marks)** The candidate demonstrates a basic knowledge of legislation including the Computer Misuse Act; the material is basic and contains some inaccuracies. The candidate makes a limited attempt to apply acquired knowledge and understanding to the context provided.

The candidate provides a limited discussion which is narrow in focus. Judgments if made are weak and unsubstantiated. The information is basic and communicated in an unstructured way. The information is supported by limited evidence and the relationship to the evidence may not be clear.

**0 marks**\
No attempt to answer the question or response is not worthy of credit.
'''
guidance = '''
AO1\
Computer Misuse Act is legislation aimed at criminalising unauthorised access to a computer system Three stages:\
Unauthorised access to a computer system\
Unauthorised access with intent to commit further offences\
Unauthorised modification of computer material\
Punishable by up to twelve months in prison and an unlimited fine.

AO2\
Computer users who investigate how systems work require authorisation in order to not break the Act.\
Examples such as changing a social media post on a friend’s mobile phone potentially breaks all three sections of the Act.\
Investigation of systems can break the Act without intent, e.g. by changing server logs because of their

actions.\
Users must be aware of the Act (as with any other law) in order to be responsible.

AO3\
Material available online (e.g. self study videos) that explain how systems work and teach without the need to investigate using\
unauthorised access.\
Investigating systems that you own yourself or have authorisation to access does not break the law. Systems are offered to users with strict conditions attached and investigation is not a legitimate excuse for breaking the law. Ethical / white hat hackers will not break this law because they have authorisation.\
Grey and black hat hackers will break Computer Misuse Act.
'''

