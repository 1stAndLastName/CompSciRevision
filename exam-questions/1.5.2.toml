understanding of artificial intelligence, machine learning and how biases can be inherited. The material is generally accurate and detailed.

The candidate is able to apply their knowledge and understanding directly and consistently to the context provided. Evidence/examples will be explicitly relevant to the explanation.

The candidate provides a thorough discussion which is well balanced. Evaluative comments are consistently relevant and well-considered.

There is a well-developed line of reasoning which is clear and logically structured. The information presented is relevant and substantiated.

**Mark Band 2-Mid Level (4-6 marks)** The candidate demonstrates reasonable knowledge and\
understanding of artificial intelligence, machine learning and/or how biases can be inherited; the material is generally accurate but at times underdeveloped.

The candidate is able to apply their knowledge and understanding directly to the context provided although one or two opportunities are missed. Evidence/examples are for the most part implicitly relevant to the explanation.

The candidate provides a sound discussion, the majority of which is focused. Evaluative comments are for the most part appropriate, although one or two opportunities for development are missed.

There is a line of reasoning presented with some structure. The information presented is in the most part relevant and supported by some evidence.

**Mark Band 1-Low Level (1-3 marks)** The candidate demonstrates a basic knowledge of some aspects of artificial intelligence or machine

(2), (AO2.1) (2), (AO3.3). (3)

learning; the material is basic and contains some inaccuracies. The candidate makes a limited attempt to apply acquired knowledge and understanding to the context provided.

The candidate provides a limited discussion which is narrow in focus. Judgments if made are weak and unsubstantiated. The information is basic and communicated in an unstructured way. The information is supported by limited evidence and the relationship to the evidence may not be clear.

**0 marks**\
No attempt to answer the question or response is not worthy of credit.
'''
guidance = '''
AO1\
Artificial intelligence is used for computer systems that are required to perform tasks that normally require

human intelligence. AI is generally programmed. Machine learning is where a machine improves its performance/output through experience/access to data. Machine learning is a subset of AI.

AO2\
AI follows programming so if a program contains biases then so will the AI outcomes. Programmers must be aware of this and tackle it during design/implementation/testing. Machine learning bias depends on data given. Larger data sets are generally more inclusive/less biased but must be aware of data that is itself biased. Candidates may give examples that meet this.

AO3\
Thorough testing, multiple\
programmers and scrutiny of data sets are essential to ensure that unconscious biases are not inherited. If not thoroughly considered then biases will certainly be inherited. Datasets for machine learning need to be large enough to be representative but not so large that data is not able to be checked.

**Examiner’s Comments**\
There were a wide range of responses to this question and a wide range of marks given. The most successful responses were able to address all parts of the question and could give the meaning of AI as well as some relevant examples of AI bias. They were also able to give at least one measure that could be taken. Many candidates used self-driving cars as their only example and should be encouraged to explore the use of AI in different fields. Some confused the AI being biased with people being biased against AI. Many candidates were unable to give relevant measures for preventing bias. Candidates should be encouraged to make sure they include all points the question asked for, in their answer.
'''

