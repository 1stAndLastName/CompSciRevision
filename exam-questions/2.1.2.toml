[[question]]
number = 5
marks = 9

[[question.part]]
label = "5"
text = '''
A programmer has partially developed a bubble sort algorithm in pseudocode.

This will partially sort an array of numbers called `numbers` that is passed as a parameter.

```
01 procedure bubbleSort(numbers : byRef)
02   flag = true
03   for x = 0 to numbers.length – 1
04     if numbers[x] > numbers[x + 1] then
05       holdValue = numbers[x]
06       numbers[x] = numbers[x + 1]
07       numbers[x + 1] = holdValue
08       flag = false
09     endif
```

```
10   next x
11 endprocedure
```
'''

[[question.part]]
label = "5(i)"
marks = 3
text = '''
Explain why the procedure `bubbleSort` accepts the array `numbers` by reference and not by value.
'''

[[question.part]]
label = "5(ii)"
marks = 1
text = '''
The programmer has used a `for` loop on line 3 in the procedure `bubbleSort`. A `for` loop is a count controlled loop.

State what is meant by the term ‘count controlled loop’.
'''

[[question.part]]
label = "5(iii)"
marks = 3
text = '''
State the purpose of the variable `holdValue` in the procedure `bubbleSort`.
'''

[[question.part]]
label = "5(iv)"
marks = 2
text = '''
The procedure `bubbleSort` will only partially sort the array `numbers` into order.

Describe what the programmer would need to add to the algorithm to enable it to fully sort the numbers into order.
'''

[[question.mark_scheme]]
label = "5(i)"
marks = 3
answer = '''
1 mark per bullet

- by reference will reorder the contents of the array
- …so the new order can be accessed by the main program / so will be saved when the procedure ends
- by value will change the array only in this procedure
- … and so would need to return the array.
'''
guidance = '''
**Examiner’s Comments**

Many candidates struggled to go beyond recall of definitions for calling by reference and calling by value and struggled to apply it to the code given and to provide a detailed explanation.

The bubble sort was defined as a procedure and not a function, so if numbers had been passed by value, a copy of the array would have been passed, and any changes made would not have been kept after the procedure had completed execution.
'''

[[question.mark_scheme]]
label = "5(ii)"
marks = 1
answer = '''
A loop that repeats a fixed / set number of times
'''
guidance = '''
**Examiner’s Comments**

Most candidates could accurately define a ‘count controlled loop’ as one that repeated a predefined number of times, although some candidates gave an ambiguous response that was equally applicable to a conditional loop.
'''

[[question.mark_scheme]]
label = "5(iii)"
marks = 3
answer = '''
- To temporarily hold a value (for numbers\[x\])…
- …while it is being transferred from one position to another…
- ….in the array numbers
- To stop values over writing each other
'''
guidance = '''
**Examiner’s Comments**

Many candidates found it difficult to explain the purpose of the `holdValue` variable in context. Where candidates achieved some of the marks, they most frequently identified `holdValue` as a temporary store that was required to prevent accidental overwriting of data during the swap process. Relatively few were able to accurately describe how the variable allowed the contents of `dataArray[x]` and `dataArray[x+1]` to be swapped.

Exemplar 1

*[Image in the original mark scheme, not shown here.]*

This exemplar very clearly states exactly how and why the variable `holdValue` is required.
'''

[[question.mark_scheme]]
label = "5(iv)"
marks = 2
answer = '''
- Add a (second outer) loop
- That will repeat for each pass / repeat until the flag is set to true at the end of a pass
'''
guidance = '''
**Examiner’s Comments**

Many candidates found it challenging to apply knowledge of a bubble sort to the code given. While a pleasing number identified the need to have an outer loop, there were far fewer

who were able to expand on this to explain that this was required to repeat the process for the requi red number of passes, or until no swaps had occurred during a pass.
