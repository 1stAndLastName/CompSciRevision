[[question.part]]
label = "1"
marks = 4
text = '''
A group of students are designing a racing car game. The game will allow players to enter their name and then a choice of vehicle. They will then race against other vehicles that will be controlled by the program. Players will use the arrow keys to control their vehicle.

The students are identifying the inputs and outputs for the game.

Complete the table by identifying **two** inputs and **two** outputs for the game.

| **Input 1** | …… …… |
|---|---|
| **Input 2** | …… …… |
| **Output 1** | …… …… |
| **Output 2** | …… …… |
'''

[[question.mark_scheme]]
label = "1"
marks = 4
answer = '''
1 mark for each input to max 2 e.g.

- Entering a name
- Selecting a vehicle
- Pressing arrow key to move forward
- Pressing arrow key to move backward
- Pressing arrow key to move left
- Pressing arrow key to move right

1 mark for each output to max 2 e.g.

- Images of vehicles to choose from
- Background of area
- Image of other vehicles
- Image of controls and description of what they do
'''
guidance = '''
Allow any feasible input/output for scenario

**Examiner’s Comments**

While many candidates scored full marks for this question for identifying suitable inputs and outputs within the context of the problem a number of candidates scored no marks for erroneously giving input or output devices. Sometimes responses were unqualified such as ‘left arrow key’ rather than ‘left arrow to turn left’ where candidates did not identify an input within the context of the scenario as an input to the game.
'''

