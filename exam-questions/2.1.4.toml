[[question.part]]
label = "1"
marks = 4
text = '''
Eve enjoys playing board games. Her favourite board game is called “Pot Luck”. This has a numbered grid of 10 squares by 10 squares. Each square has a number between 1 and 100.

Players place their game counters on square 1. A 30-minute timer is set which counts downwards. Each player rolls two 6-sided dice and then moves their game counter that number of squares. Some squares tell the player to pick up a card. These have instructions on, such as 'Move forward 10 spaces'. If the player lands on one of these squares they move according to the instruction on the card. The first player to land on square 100, is announced as the winner. If no winner is announced before the timer runs out, then it is a draw.

Logical conditions are checked once a player has rolled the dice.

Describe **two** different logical conditions and how the result will affect the outcome of the game.

**Logical Condition 1**

Condition:

Outcome:

**Logical Condition 2**

Condition:

Outcome:
'''

[[question.mark_scheme]]
label = "1"
marks = 4
answer = '''
1 mark for condition and 1 mark for outcome to max 4\
e.g.

- **Condition:** Check if the square has an instruction ...
- **Outcome:** ... move the player the number of places specified

- **Condition:** Check if they have landed on square 100 ...
- **Outcome:** ... Announce the player as the winner

- **Condition:** Check if the timer is 0 ...
- **Outcome:** ... Announce the game as a draw
'''
guidance = '''
Allow other suitable examples that are relevant to the scenario.

The outcome must be related to the condition for a mark to be awarded.

**Examiner’s Comments**

Some candidates did not present clear conditions but gave\
descriptions of actions to perform within the game such as ‘roll dice’. The condition required an identification within the context of something that would lead to a Boolean result with consequent outcome. For example, if the timer runs out then the game will end in a draw.
'''

[[question]]
number = 2
marks = 40

[[question.part]]
label = "2(a)"
marks = 3
text = '''
A game is being written that makes use of object-oriented programming. A prototype for one part of the game is being designed that includes a character, a road and a prize to collect.

The road will have 50 spaces that a character can move along. Each space on the road will store a null value or a prize object for the user to collect. Each space is numbered sequentially from the first space (position 0) to the last space (position 49) and will not change during the game. As the player travels down the road, the position the player is on the road will be output.

The road is designed to be a 1-dimensional array with the identifier `road`.

Explain why an array is a suitable data structure to represent the road.
'''

[[question.part]]
label = "2(b)"
text = '''
The characters and prizes are designed as separate classes. 10 of the spaces on the road will contain an instance of the class `Prize`. The other spaces will be empty.

The class design for `Prize` is here.

```
class: Prize
```

```
attributes:
private name : string
private type : string
private value : integer
```

```
methods:
new()
getName()
getType()
getValue()
```

`new()` is the constructor method. The name, type and value are passed to the constructor as parameters which then assigns these to the attributes.
'''

[[question.part]]
label = "2(b)(i)"
marks = 2
text = '''
The method `getName()` returns the data in the attribute `name`.\
Write the method `getName()` using pseudocode or program code.
'''

