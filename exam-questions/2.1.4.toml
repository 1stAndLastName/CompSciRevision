marks = 9
text = '''
Poppy would like to use a bubble sort to sort 250 000 numbers into order from lowest to highest.

Currently the first five numbers before they have been sorted are:

| 195 584 | 167 147 | 158 187 | 160 125 | 184 236 |
|---|---|---|---|---|

Currently the last five numbers before they have been sorted are:

| 1058 | 19 558 | 1915 | 20 215 | 15 |
|---|---|---|---|---|

\* Discuss how a bubble sort works and how efficient it will be when sorting these 250 000 items into order from lowest to highest.
'''

[[question.part]]
label = "10(b)"
marks = 1
text = '''
State the number of comparisons that will need to be made in the first pass of the bubble sort.
'''

[[question.mark_scheme]]
label = "10(a)"
marks = 9
answer = '''
**Mark Band 3 – High level (7-9 marks)** The candidate demonstrates a thorough knowledge and understanding of bubble sorts; the material is generally accurate and detailed. The candidate is able to apply their knowledge and understanding directly and consistently to the context provided. Evidence/examples will be explicitly relevant to the explanation. The candidate is able to weigh up the use of bubble sorts within the context which results in a supported and realistic judgment as to whether it is suitable to use within the context.There is a well- developed line of reasoning which is clear and logically structured. The information presented is relevant and substantiated.

**Mark Band 2 – Mid level (4-6 marks)** The candidate demonstrates reasonable knowledge and understanding of bubble sorts; the material is generally accurate but at times underdeveloped.The candidate is able to apply their knowledge and understanding directly to the context provided although one

or two opportunities are missed.\
Evidence/examples are for the most part implicitly relevant to the explanation. The candidate makes a reasonable attempt to come to a conclusion showing some recognition of influencing factors that would determine whether it is possible to use bubble sorts in this context.\
There is a line of reasoning presented with some structure. The information presented is in the most part relevant and supported by some evidence

**Mark Band 1 – Low Level (1-3 marks)** The candidate demonstrates a basic knowledge of bubble sorts with limited understanding shown; the material is basic and contains some inaccuracies. The candidates makes a limited attempt to apply acquired knowledge and understanding to the context provided. The candidate provides nothing more than an unsupported\
assertion.The information is basic and comunicated in an unstructured way. The information is supported by limited evidence and the relationship to the evidence may not be clear.

**0 marks**\
No attempt to answer the question or response is not worthy of credit.
'''
guidance = '''
**Knowledge and Understanding**

- All adjacent items are compared against each other.
- The biggest number in the adjacent pair is swapped over with the smallest number. A temp variable is used to hold the data while it’s being moved.
- When a swap is made a flag is set.
- This is repeated for all adjacent values, known as one pass.
- At the end of one pass, the largest item should appear at the end of the list.
- If at the end of the list the flag has been set the flag is unset and the algorithm starts from the beginning of the list again.

- When the algorithm gets to the end of the list and the flag is unset the list is sorted.

**Application**

- As there are 250,000 items a bubble sort would perform very slowly as a lot of passes will need to be made in order to sort the items.
- Bubble sorts are better suited to data sets where the items are almost/partly sorted. However the smaller numbers are currently towards the end and the larger numbers are towards the start.
- This will therefore increase the amount of comparisons / passes/swaps required which will therefore slow the performance of the sort down.

**Evaluation**

- The algorithm is easy to implement as the number of lines of code is less than other standard sorting algorithms.
- Although a bubble sort will be able to sort the items into order, it will take longer than other sorting algorithms due to the number of items and the current order or items in the unsorted list.
'''

