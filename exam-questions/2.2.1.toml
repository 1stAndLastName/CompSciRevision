guidance = '''
**Knowledge and Understanding**

- A module is a set/block of instructions which is given a name which can then be called upon by the main body of code to complete a task(s).
- The different modules within the program are then executed when the program is run in order to provide a solution to the problem.
- A module can be created using a function which is a block of code that will return a value, or a procedure which is a block of code that will not return a value.
- Alternatively, a module may contain a collection of different sub-programs (procedures/functions) that are combined together to complete a task.

**Application**

- The program is a large program and therefore the use of modules will allow the program to be split into different subtasks.
- Different programmers can agree the procedure names and parameters needed for each module.
- Each subtask can then be written and tested by different programmers simultaneously which will therefore reduce development time.

- Each subtask can be self-contained which means that the work carried out by one programmer should not affect another.
- Each subtask can be programmed by specific programmers who have the skills and expertise in that area/language being used.

**Evaluation**

- Modularity will reduce development time as the team of programmers can work together at the exact same time on the same program.
- Programmers can specialise in their area of expertise/language which therefore means blocks can be reused by other programmers who may not have expertise in some areas.
- Programmers may feel restricted if they have to follow the agreed house style. This could have a knock-on effect with other programmers if not followed.

**Examiner’s Comments**\
Candidates continue to struggle with the banded response question on the paper and most responses did not have a clear structure.

These questions always require candidates to

show knowledge by defining the terms being used, applying knowledge to the specific context given in the question, and then weighing the merits or drawbacks in an evaluation.

Few candidates could develop the concept of modularity to the level of interfaces and the need for agreed standards for function calls and return values. Most responses focused on the basics of the use of functions and procedures but did not demonstrate how different modules might be integrated.
'''

