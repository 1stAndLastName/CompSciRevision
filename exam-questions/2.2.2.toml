[[question]]
number = 1
marks = 9

[[question.part]]
label = "1(a)"
text = '''
A group of students are designing a racing car game. The game will allow players to enter their name and then a choice of vehicle. They will then race against other vehicles that will be controlled by the program. Players will use the arrow keys to control their vehicle.

The students use abstraction during the design process.
'''

[[question.part]]
label = "1(a)(i)"
marks = 3
text = '''
State what is meant by abstraction **and** describe how it can be used to design the racing car game.

Definition

Use
'''

[[question.part]]
label = "1(a)(ii)"
marks = 3
text = '''
Explain why it is beneficial to use abstraction when designing a computer program such as a game.
'''

[[question.part]]
label = "1(b)(i)"
marks = 1
text = '''
The group of students use decomposition.

State what is meant by decomposition.
'''

[[question.part]]
label = "1(b)(ii)"
marks = 2
text = '''
Describe **one** benefit of using decomposition when designing a computer program such as a game.
'''

[[question.mark_scheme]]
label = "1(a)(i)"
marks = 3
answer = '''
1 mark for definition, 1 mark each for each example of use to max 2 (3 overall)\
**Definition:**

- Removal of unnecessary detail

**Example use:**

- E.g. simplifying scenery
- E.g. removing internal features of a vehicle that are not needed
- E.g. simplify physics for vehicle movement
- E.g. The vehicles may not be drawn to scale
'''
guidance = '''
Allow any reasonable examples for this scenario

For the example use, allow 2 marks for stating a valid example of abstraction with an expansion. For example,“simplify track (1) by taking out the bumps in the road (1)” would be given two marks.

**Examiner’s Comments**

Many candidates scored two marks for defining abstraction and giving one example of its application to the game, but fewer managed to identify a second example for full marks.
'''

[[question.mark_scheme]]
label = "1(a)(ii)"
marks = 3
answer = '''
1 mark each to max 2

- Simplifies the problem / algorithm / programming code
- Faster to create the program code
- Final program uses less memory/processor time
- Programmer can focus on core aspects of the game
- Completed game will be simpler for end users to understand / play
'''
guidance = '''
Do not accept a reiteration of a definition of abstraction.

**Examiner’s Comments**

Some candidates reiterated a definition of abstraction and did not focus on the benefits of abstraction as the question required. Most candidates struggled to give more than one or two benefits. There were also a number of unqualified responses such as ‘saves time’ that did not specify ‘saving coding development time’.
'''

[[question.mark_scheme]]
label = "1(b)(i)"
marks = 1
answer = '''
Splitting the problem down into smaller (sub) problems
'''
guidance = '''
**Examiner’s Comments**

Most candidates correctly defined decomposition, but some candidates lost marks for lack of clarity for not specifying that a problem is broken down into sub problems.
'''

[[question.mark_scheme]]
label = "1(b)(ii)"
marks = 2
answer = '''
1 mark each to max 2 e.g.

- To break the problem down into individual components
- …to see which components can be tackled concurrently
- Identify any resusable program elements …
- …to avoid creating the same algorithm twice
- Split the program between individuals
- … so they can focus on individual elements / to focus on their speciality
- Identify the subroutines and how they will interract
- …so everyone knows the requirements for their part of the problem
- Easier to tackle/focus on one smaller problem at a time…
- … so this simplifies writing/testing code
'''
guidance = '''
Allow for other valid benefits of using decomposition.

**Examiner’s Comments**

Many candidates identified that decomposition would make it simpler to code individual subproblems but then lacked a clear related expansion. The most popular response was that this allowed workload to be shared between different members of a team to reduce overall development time or to play to team member expertise.
'''

[[question]]
number = 2
marks = 12

[[question.part]]
label = "2"
marks = 12
text = '''
A company runs a Virtual Learning Environment (VLE). Schools can register students to use the VLE. The students get their own account and the school can view and monitor their students who are registered. There are currently over 10 000 schools registered, each with up to 1000 students.

The students can watch videos, take quizzes and communicate using forums and online chat tools.

The company gathers a large amount of data and wants to use data mining to help them decide how to improve the VLE in the future.

Discuss how the company can use data mining to decide how to improve the VLE.

You should include the following in your answer:

- the characteristics of data mining
- the benefits of data mining in this scenario
- the drawbacks of data mining in this scenario.
'''

[[question.mark_scheme]]
label = "2"
marks = 12
answer = '''
**Mark Band 3 - High level (9-12** **marks)**\
The candidate demonstrates a thorough knowledge and\
understanding of data mining; the material is generally accurate and detailed.\
The candidate is able to apply their knowledge and understanding directly and consistently to the context provided. Evidence/examples will be explicitly relevant to the explanation. There is a well-developed line of reasoning which is clear and logically structured. The information presented is relevant and substantiated.

**Mark Band 2 - Mid level (5-8 marks)** The candidate demonstrates reasonable knowledge and understanding of data mining; the material is generally accurate but at times underdeveloped.\
The candidate is able to apply their knowledge and understanding directly to the context provided although one or two opportunities are missed.

Evidence/examples are for the most part implicitly relevant to the explanation.\
The candidate provides a reasonable discussion, the majority of which is focused.\
Evaluative comments are, for the most part appropriate, although one or two opportunities for development are missed.\
There is a line of reasoning presented with some structure. The information presented is in the most part relevant and supported by some evidence.

**Mark Band 1 - Low Level (1-4** **marks)**\
The candidate demonstrates a basic knowledge of data mining with limited understanding shown; the material is basic and contains some\
inaccuracies. The candidates makes a limited attempt to apply acquired knowledge and understanding to the context provided.\
The candidate provides a limited discussion which is narrow in focus. Judgements if made are weak and unsubstantiated.\
The information is basic and comunicated in an unstructured way. The information is supported by limited evidence and the relationship to the evidence may not be clear.

**0 mark**\
No attempt to answer the question or response is not worthy of credit.
'''
guidance = '''
**AO1: Knowledge and**\
**Understanding Indicative content**

- Analysis of patterns and anomalies in large data sets
- Turns large quantities of data into useful information. These may not be immediately obvious to a casual reader.
- Resulting information is used to make predictions, to increase revenue, to target advertising and improve services.

**AO2: Application**

- Identify the amount of time students spend on the system
- Identify the days / times when is it used most? Least?
- Identify the features/tools students use most and least
- Identify which questions find the most difficult.

- Identify the time / day of the week when students learn the most
- Identify which schools are performing better or which areas of the country are performing better.
- Identify which courses students are enjoying more

**AO3: Evaluation**

- Data mining can spot patterns/trends, however it cannot explain them. Company may still need to do extra research.
- Students may have privacy concerns about their activities being logged.
- Requires powerful computers with a lot of processing power to process huge amounts of data.
- Need to make sure data collection is legal and in terms and conditions
- Analysis can be costly e.g. may need an external company
- Security - data being collected requires protection
- Include more features students use so they will use it more, and gain more revenue
- Identifying features not used means resources and development can be moved from these onto other areas

**Examiner’s Comments**

Many Level 2 responses\
demonstrated an ability to define data mining and give relevant examples of its use. Few candidates were able to give an evaluative critique as to the effectiveness of data mining for this scenario.

Many candidates struggled to structure their responses. Where candidates did produce a clear structure, they often used paragraphs effectively, starting with a definition, considering benefits and drawbacks, then going on to evaluate within the parameters of the scenario.
'''

