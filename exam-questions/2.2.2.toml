guidance = '''
**AO1: Knowledge and**\
**Understanding**\
**Indicative content**

- Problem recognition is identifying that there is a problem to be solved, to determine exactly what the problem is from a description/scenario and to determine if the problem can be solved with computational methods
- Decomposition is splitting the problem down into subproblems that can be solved independently

**AO2: Application**

- Problem recognition: identifying the need for the scheduling system, what it will take as its inputs, what will need to be output etc.
- Decomposition: subproblems could include: `o` inputting the requirements `o` generating possible routes `o` evaluating the routes `o` outputting the schedule

**AO3: Evaluation**\
Computational methods allow the e.g.:

- programmer to determine what the problem, what the challenges may be and what additional information is required before starting to code the solution
- identification of the key features for programmers to focus on
- splitting of the task into smaller, more manageable/solvable problems which allows for a solution to be developed quicker
- design of an effective/efficient solution that makes best use of a processor
- splitting of a task to allow programmers to focus on areas they specialise in.

**Examiner’s Comments**

Many Level 1 responses gave simplistic definitions of problem recognition and/or decomposition, often with more successful\
descriptions for decomposition. Relatively few candidates could clearly state that problem recognition starts with identifying inputs and outputs. Some degree of application to the question scenario context was required for Level 2. Most candidates’ marks clustered around Level 2 with 4

or 5 marks. Many generic answers focused on problem recognition and/or decomposition as learnt terms, with associated benefits given, but little more than that, which limited marks to Level 2. For Level 3 an evaluation of ideas relevant to the context of the scenario given was expected.

Some good responses indicated recognition of a pathfinding type problem with a need for shortest path/A\* algorithm, approximation to travelling salesman type solutions or the need to employ heuristics. Candidates giving this level of insight often accessed Level 3.
'''

