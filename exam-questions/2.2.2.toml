The final game will involve multiple computer-controlled characters and interactive elements that make use of artificial intelligence to determine the moves they will make.

The artificial intelligence will use heuristics to determine where the computer-controlled characters will move in the game.

Discuss how heuristics can be used in algorithms.

You should include the following in your answer:

- the purpose of heuristics
- the benefits and drawbacks of heuristics
- the suitability of heuristics in algorithms within a computer game.
'''

[[question.mark_scheme]]
