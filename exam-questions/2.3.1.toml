- Concatenating each remainder / storing each remainder in an array/list
- Outputting the correct result

e.g. pseudocode

```
number = input("Enter a number")

endResult = ""

while number != 0
  remainder = number MOD 8
  number = number DIV 8
  endResult = str(remainder) + str(endResult)
endwhile
print endResult
```
