Many candidates continue to think that a merge sort performs sorting of data within lists.

Merge sort performs the sorting part of the operation when it merges together two separate sub- lists that are already in a sorted order. This is done with the use of a pointer to each of the two sub-lists that acts as a placeholder. The two positions in the separate lists are compared, and the smaller item is added to the new sorted list and the pointer is incremented. The merging process then repeats until the sub-lists have been completely merged.
