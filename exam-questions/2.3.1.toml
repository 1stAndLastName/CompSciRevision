text = '''
A programmer is designing a program that will store data.

The programmer is deciding whether to store the data in a stack or a queue.

Identify **one** similarity and **one** difference between a stack and a queue.

Similarity

Difference
'''

[[question.mark_scheme]]
label = "2"
marks = 2
answer = '''
1 mark for similarity:

- Both are data structures / store data
- Both allow data to be added/removed
- Both have identifier(s) / pointer values

1 mark for difference:

- Stack is LIFO and queue is FIFO
- Queue supports enqueue/dequeue operations whilst stack supports push/pop operations
- Queue require two pointers whilst stacks only require one pointer
'''
guidance = '''
**Examiner’s Comments**

Most candidates demonstrated knowledge of the purpose of stacks and queues. For the similarity, a frequent response was that both stacks and queues are data structures used to store data. For the difference, most candidates identified that a stack was a LIFO structure while a queue was a FIFO structure.
'''

[[question]]
number = 3
marks = 9

[[question.part]]
label = "3"
marks = 9
text = '''
Kofi and Zac both write a different pseudocode algorithm to read the data from a text file into an array.

Kofi's Algorithm

```
fileName = "data.txt"
fileToRead = openRead(fileName)
for x = 0 to 1000
 anyData = fileToRead.endOfFile()
 if NOT anyData then
  x = 1001
 else
  dataValue = fileToRead.readLine()
  array[x] = dataValue
 endif
next x
fileToRead.close()
```

Zac's Algorithm

```
function readData(fileName)
 array data[100]
 x = 0
 fileToRead = openRead(fileName)
 while NOT fileToRead.endOfFile()
  data[x] = fileToRead.readLine()
  x = x + 1
 endwhile
 return data
endfunction
```

The solution needs to be used in different programs. Each program will use a different text file where the number lines in the text file is unknown.

Compare the suitability of each algorithm for the given problem.

You should include the following in your answer:

- the suitability of the programming techniques including the use of loops
- how effectively the solution meets the requirements.
'''

[[question.mark_scheme]]
label = "3"
marks = 9
answer = '''
**Mark Band 3-High Level**\
**(7-9 marks)**\
The candidate demonstrates thorough knowledge and understanding of suitability of algorithms; the material is generally accurate and detailed.\
The candidate is able to apply their knowledge and understanding directly and consistently to the context provided. Evidence/examples will be explicitly relevant to the explanation. The candidate provides a thorough discussion which is well-balanced. Evaluative comments are\
consistently relevant and well-considered.\
There is a well-developed line of reasoning which is clear and logically structured. The information presented is relevant and substantiated.

**Mark Band 2-Mid Level**\
**(4-6 marks)**\
The candidate demonstrates reasonable knowledge and understanding of suitability of algorithms; the material is generally accurate but at times underdeveloped.\
The candidate is able to apply their knowledge and understanding directly to the context provided although one or two opportunities are missed. Evidence/examples are for the most part implicitly relevant to the explanation. The candidate provides a reasonable discussion, the majority of which is focused. Evaluative comments are for the most part appropriate, although one or two opportunities for development are missed.\
There is a line of reasoning presented with some structure. The information presented is in the most part relevant and supported by some evidence.

**Mark Band 1-Low Level**\
**(1-3 marks)**\
The candidate demonstrates a basic knowledge of suitability of algorithms, with limited understanding shown; the material is basic and contains some inaccuracies. The candidate makes a limited attempt to apply acquired knowledge and understanding to the context provided.\
The candidate provides a limited discussion which is narrow in focus. Judgments if made are weak and unsubstantiated. The information is basic and communicated in an\
unstructured way. The information is supported by limited evidence and the relationship to the evidence may not be clear.

**0 mark**\
No attempt to answer the question or response is not worthy of credit.
'''
guidance = '''
**AO1: Knowledge and** **Understanding** e.g.

- Kofi’s algorithm reads data from the text file and writes these value to an array. It cannot be called by different programs, doesn’t work with different text files and does not consider the number of items in the file.
- Zac’s program also reads data from the text file and writes these values to an array. It can be called by different programs, works with different file names and does consider the number of items in the file.

**AO2.1: Application** e.g.\
Kofi's algorithm:

- Has additional/unneces sary variables
- ...e.g. fileName, dataValue
- Loops 1000 times which is inappropriate when it needs to be used with unknown quantity
- Will not read any lines after the first 1000

Zac's algorithm:

- Uses a function so that is can be used in different programs / is independent
- Takes file name as parameter so that it can be called with different files
- The array size is 100. Therefore, if the data being read is greater than 100 the program will crash.
- Does not close the file

**AO3.3: Evaluation** e.g.

- Zac's is more memory efficient as it uses fewer variables
- Kofi's is more suitable in that it closes the file so it does not remain open in memory
- Zac's is more suitable to be used in different

programs due to function and not hard coding the file name

- Zac’s is easier to alter for a different file size as fewer lines of code would need to be altered

**Examiner’s Comments**

There were a large number of either blank or very brief responses where candidates displayed no ability to read and interpret code. The question source material was designed to help candidates to comment on a range of programming practices such as file opening and closing, conditional versus count- controlled loops and the benefits of the use of functions with parameters.

Level 1 responses often just focused on the use of two different loop types. There were few Level 3 responses that gave insightful evaluative comments. Where candidates were able to do so they often focused on memory usage or the ability to cope with different data sets that could be read.

Exemplar 2

*[Image in the original mark scheme, not shown here.]*

This response showed that the candidate has thought about the issues related to the question and had carefully annotated the code when analysing it.

The response was well- structured taking each of the algorithms in turn and displayed a clear level of evaluative insight.
'''

