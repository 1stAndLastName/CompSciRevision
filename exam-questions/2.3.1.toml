text = '''
A sorting algorithm has a best **time** complexity of O(n).\
Describe what is meant by the best **time** complexity O(n) for a sorting algorithm.
'''

[[question.part]]
label = "4(ii)"
marks = 2
text = '''
Another sorting algorithm has a worst **space** complexity of O(log(n)).

Describe what is meant by the worst **space** complexity O(log(n)) for a sorting algorithm.
'''

[[question.part]]
label = "4(iii)"
marks = 1
text = '''
Identify the **time** complexity that means the time will not change even when the number of items increases.
'''

[[question.part]]
label = "4(iv)"
marks = 1
text = '''
Identify the **space** complexity that means the amount of memory (space) used will double each time a new item is included.
'''

[[question.mark_scheme]]
label = "4(i)"
marks = 2
answer = '''
1 mark each

- Linear
- The time will (increase) in **direct proportion** to the number of items
'''
guidance = '''
**Examiner’s Comments**

Many candidates did not identify linear but gave a description for ‘directly proportional’ or vice-versa, so only gained one mark. Candidates needed to specify that the time required increased in direct proportion to the number of items. Proportion on its own was too vague and could have meant inverse proportion

for example.

Incorrect responses included ‘quickest time to find / least operations’ defining best case rather than answering the question regarding O(n).
'''

[[question.mark_scheme]]
label = "4(ii)"
marks = 2
answer = '''
1 mark each

- Logarithmic
- The additional memory space required grows at a decreasing rate as the number of items increases
'''
guidance = '''
**Examiner’s Comments**

Many candidates did not identify logarithmic but tried to give a description or vice-versa. Many candidates just said the memory space increased in proportion to the log of n without explaining what this meant. For the second mark candidates had to explain that as the number of items n increased the amount of additional memory required became progressively smaller.
'''

[[question.mark_scheme]]
label = "4(iii)"
marks = 1
answer = '''
Constant / O(1)
'''
guidance = '''
**Examiner’s Comments**

The vast majority of candidates gave the correct response of constant or O(1).
'''

[[question.mark_scheme]]
label = "4(iv)"
marks = 1
answer = '''
Exponential / O(2<sup>n</sup>) / O(K<sup>n</sup>)
'''
guidance = '''
**Examiner’s Comments**

Half the candidates correctly identified exponential complexity, but common erroneous responses included O(n<sup>2</sup>) or O(2n) instead of O(2<sup>n</sup>).

*[Image in the original mark scheme, not shown here.]*

**Misconception**

A number of candidates

erroneously thought that n<sup>2</sup> or 2<sup>n</sup> demonstrated exponential growth instead of 2<sup>n</sup>. Candidates need to have the mathematical grounding to understand the difference between different Big O growth factors.
'''

