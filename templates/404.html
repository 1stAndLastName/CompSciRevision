{% extends "base.html" %}
{% block title %}Page not found{% endblock %}
{% block main %}
<section class="not-found">
  <p class="not-found-code num" aria-hidden="true"><code>0x194</code></p>
  <h1>Page not found</h1>
  <p>There is nothing at this address. It may have a typo, or the page may have moved.</p>
  <p class="aside">(0x194 is 404 in hexadecimal.)</p>
  <a class="button primary" href="/">Go to all topics</a>
</section>
{% endblock %}
